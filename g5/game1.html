<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js-common.js"></script>
<title>G5 Game 1 – Word Scramble</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #F3E5F5; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  #zh-hint { font-size: 2.2rem; font-weight: 900; color: #7B1FA2; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; }
  .speak-btn {
    background: #7B1FA2; color: white; border: none; border-radius: 50%;
    width: 50px; height: 50px; cursor: pointer; font-size: 1.5rem;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  .speak-btn:hover { transform: scale(1.1); }
  
  .scrambled-area { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; min-height: 60px; }
  .letter-tile {
    width: 55px; height: 55px; background: white; border: 3px solid #7B1FA2;
    border-radius: 12px; font-size: 2rem; font-weight: 800; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    transition: all 0.2s; color: #7B1FA2; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .letter-tile:hover { transform: translateY(-5px); background: #F3E5F5; }
  
  .answer-area {
    min-height: 70px; border-bottom: 5px solid #7B1FA2;
    display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
    align-items: flex-end; padding-bottom: 5px;
  }
  
  .ans-tile { color: #4A148C; font-size: 2.5rem; font-weight: 900; min-width: 30px; }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.98); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:20px; text-align:center; background:#7B1FA2; color:white;">
  <a href="index.html#p1" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 Home</a>
  <h1>Word Scramble</h1>
  <p>單字大重組 🌪️</p>
</header>

<div class="game-container">
  <div style="font-size:1.2rem; color:#7B1FA2; font-weight:800; margin-bottom:10px;">第 <span id="q-num">1</span> / 10 題</div>
  <div id="zh-hint">
    <span id="zh-text">載入中...</span>
    <button class="speak-btn" onclick="playCurrent()">🔊</button>
  </div>
  
  <div class="answer-area" id="answer-area"></div>
  <div class="scrambled-area" id="scrambled-area"></div>
  
  <button onclick="clearAnswer()" style="padding:12px 30px; border-radius:30px; border:none; background:#E1BEE7; color:#4A148C; font-weight:800; cursor:pointer;">
    ❌ 清除重填
  </button>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🌪️</div>
  <h2 style="font-size:2.5rem; color:#7B1FA2;">Fantastic!</h2>
  <p style="font-size:1.4rem; margin:10px 0;">你對單字的拼法掌握得非常好！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:35px; border:none; background:#7B1FA2; color:white; font-size:1.6rem; font-weight:900; cursor:pointer; margin-top:30px;">
    完成並回首頁
  </button>
</div>

<script>
let allWords = [];
let queue = [];
let currentIdx = 0;
let userAns = "";
const PROGRESS_KEY = 'progress_g5';
const GAME_ID = 'game1';

async function loadData() {
    try {
        const resp = await fetch('../vocab_g5.json');
        if (!resp.ok) throw new Error();
        const units = await resp.json();
        units.forEach(u => u.core_vocab.forEach(v => allWords.push({ en: v[0].toUpperCase(), zh: v[1] })));
    } catch (e) {
        allWords = [{en:"DOCTOR", zh:"醫生"}, {en:"BUS", zh:"公車"}, {en:"FEVER", zh:"發燒"}];
    }
    init();
}

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function init() {
    queue = shuffle(allWords).slice(0, 10);
    nextRound();
}

function nextRound() {
    if (currentIdx >= queue.length) {
        document.getElementById('finish-screen').style.display = 'flex';
        return;
    }
    userAns = "";
    const item = queue[currentIdx];
    document.getElementById('q-num').textContent = currentIdx + 1;
    document.getElementById('zh-text').textContent = item.zh;
    
    const scrambled = shuffle(item.en.split(''));
    const area = document.getElementById('scrambled-area');
    area.innerHTML = '';
    scrambled.forEach(l => {
        const div = document.createElement('div');
        div.className = 'letter-tile';
        div.textContent = l;
        div.onclick = () => {
            if (div.style.visibility === 'hidden') return;
            userAns += l;
            div.style.visibility = 'hidden';
            updateDisplay();
        };
        area.appendChild(div);
    });
    updateDisplay();
    speak(item.en);
}

function playCurrent() {
    if (queue[currentIdx]) speak(queue[currentIdx].en);
}

function updateDisplay() {
    const item = queue[currentIdx];
    if (!item) return;
    const target = item.en;
    const ansDiv = document.getElementById('answer-area');
    ansDiv.innerHTML = userAns.split('').map(c => `<span class="ans-tile">${c}</span>`).join(' ') + 
                      target.slice(userAns.length).split('').map(() => `<span class="ans-tile">_</span>`).join(' ');
    
    if (userAns.length === target.length) {
        if (userAns === target) {
            playSound('success');
            currentIdx++;
            setTimeout(nextRound, 800);
        } else {
            playSound('error');
            setTimeout(clearAnswer, 400);
        }
    }
}

function clearAnswer() {
    userAns = "";
    document.querySelectorAll('.letter-tile').forEach(t => t.style.visibility = 'visible');
    updateDisplay();
}

function finishGame() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress[GAME_ID] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = "index.html#p1";
}

loadData();
</script>
</body>
</html>
