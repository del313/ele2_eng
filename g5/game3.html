<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js-common.js"></script>
<title>G5 Game 3 – Sentence Pro</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E8F5E9; }
  .game-container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .zh-box { font-size: 2rem; font-weight: 900; color: #2E7D32; margin-bottom: 25px; background: white; padding: 20px; border-radius: 15px; border: 4px solid #4CAF50; }
  
  .answer-zone {
    min-height: 80px; border-bottom: 5px dashed #4CAF50;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin-bottom: 30px; flex-wrap: wrap; padding: 10px;
  }
  
  .tile {
    padding: 12px 20px; background: white; border: 3px solid #4CAF50;
    border-radius: 10px; font-size: 1.3rem; font-weight: 800; color: #1B5E20;
    cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 0 #388E3C;
  }
  .tile:active { transform: translateY(4px); box-shadow: none; }
  .tile.used { opacity: 0; pointer-events: none; }
  .tile.ans { background: #C8E6C9; border-color: #2E7D32; cursor: default; }

  .options-zone { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.98); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
  
  .speaker-btn { font-size: 1.5rem; background: #4CAF50; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; margin-left: 10px; vertical-align: middle; }
</style>
</head>
<body>

<header style="padding:20px; text-align:center; background:#2E7D32; color:white;">
  <a href="index.html#p3" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 Home</a>
  <h1>Sentence Pro</h1>
  <p>造句大師 ✍️</p>
</header>

<div class="game-container">
  <div style="font-size:1.2rem; color:#2E7D32; font-weight:800; margin-bottom:10px;">Progress: <span id="q-num">1</span> / 10</div>
  
  <div class="zh-box" id="zh-display">載入中...</div>
  
  <div class="answer-zone" id="answer-zone"></div>
  <div class="options-zone" id="options-zone"></div>
  
  <div style="margin-top:40px;">
    <button onclick="resetSentence()" style="padding:12px 30px; border-radius:30px; border:none; background:#C8E6C9; color:#1B5E20; font-weight:800; cursor:pointer;">
      ❌ 清除重填
    </button>
  </div>
</div>

<div id="finish-screen">
  <div style="font-size:5rem;">🏆</div>
  <h2 style="font-size:2.5rem; color:#2E7D32;">Excellent Work!</h2>
  <p style="font-size:1.4rem; margin:10px 0;">你的英文句子組織能力非常強！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:35px; border:none; background:#2E7D32; color:white; font-size:1.6rem; font-weight:900; cursor:pointer; margin-top:30px;">
    完成並回首頁
  </button>
</div>

<script>
let allSentences = [];
let queue = [];
let currentIdx = 0;
let userOrder = [];
const PROGRESS_KEY = 'progress_g5';
const GAME_ID = 'game3';

async function loadData() {
    try {
        const resp = await fetch('../vocab_g5.json');
        const units = await resp.json();
        units.forEach(u => {
            u.sentences.forEach(s => {
                allSentences.push({ en: s[2], zh: s[0] + ": " + s[3] });
            });
        });
    } catch (e) {
        allSentences = [
            { en: "I want to be a doctor.", zh: "職業: 我想要當一名醫生。" },
            { en: "Go straight and turn left.", zh: "方向: 直走然後左轉。" }
        ];
    }
    init();
}

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function init() {
    queue = shuffle(allSentences).slice(0, 10);
    nextRound();
}

function nextRound() {
    if (currentIdx >= queue.length) {
        document.getElementById('finish-screen').style.display = 'flex';
        return;
    }
    
    userOrder = [];
    const item = queue[currentIdx];
    document.getElementById('q-num').textContent = currentIdx + 1;
    document.getElementById('zh-display').textContent = item.zh;
    
    // 處理英文單字 (移除標點)
    const words = item.en.replace(/[.!?,]/g, "").split(" ");
    const shuffled = shuffle(words);
    
    const optZone = document.getElementById('options-zone');
    optZone.innerHTML = '';
    shuffled.forEach((w, idx) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = w;
        tile.id = `opt-${idx}`;
        tile.onclick = () => addWord(w, idx);
        optZone.appendChild(tile);
    });
    
    document.getElementById('answer-zone').innerHTML = '';
}

function addWord(word, idx) {
    const tile = document.getElementById(`opt-${idx}`);
    if (tile.classList.contains('used')) return;
    
    tile.classList.add('used');
    userOrder.push({ word, idx });
    
    const ansZone = document.getElementById('answer-zone');
    const ansTile = document.createElement('div');
    ansTile.className = 'tile ans';
    ansTile.textContent = word;
    ansZone.appendChild(ansTile);
    
    checkStatus();
}

function checkStatus() {
    const target = queue[currentIdx].en.replace(/[.!?,]/g, "").split(" ");
    if (userOrder.length === target.length) {
        const userStr = userOrder.map(obj => obj.word).join(" ");
        const targetStr = target.join(" ");
        
        if (userStr === targetStr) {
            playSound('success');
            speak(queue[currentIdx].en);
            currentIdx++;
            setTimeout(nextRound, 1200);
        } else {
            playSound('error');
            setTimeout(resetSentence, 500);
        }
    }
}

function resetSentence() {
    userOrder = [];
    document.getElementById('answer-zone').innerHTML = '';
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
}

function finishGame() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress[GAME_ID] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = "index.html#p3";
}

loadData();
</script>
</body>
</html>
