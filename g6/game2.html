<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Bridge - 邏輯之橋</title>
<script src="../js-common.js"></script>
<link rel="stylesheet" href="../style-common.css">
<style>
  :root {
    --sky: #87CEEB;
    --ground: #8B4513;
    --bridge: #D2B48C;
    --correct: #27ae60;
    --wrong: #e74c3c;
  }
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--sky);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #game-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  /* Scene Elements */
  .mountain {
    position: absolute;
    bottom: 0;
    width: 30%;
    height: 40%;
    background: #7fb3d5;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    z-index: 1;
  }
  .mountain.left { left: -5%; height: 50%; }
  .mountain.right { right: -5%; height: 45%; }

  .cliff {
    position: absolute;
    bottom: 0;
    width: 200px;
    height: 35vh;
    background: var(--ground);
    z-index: 5;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
  }
  .cliff.left { left: 0; border-radius: 0 20px 0 0; }
  .cliff.right { right: 0; border-radius: 20px 0 0 0; }

  /* Character */
  #character {
    position: absolute;
    bottom: 35vh;
    left: 50px;
    font-size: 70px; /* 放大圖示 */
    z-index: 10;
    transition: all 0.5s ease-in-out;
    transform: scaleX(-1); /* 讓小人朝右 */
  }

  /* Bridge */
  #bridge-container {
    position: absolute;
    bottom: 35vh;
    left: 200px;
    right: 200px;
    height: 15px;
    display: flex;
    gap: 10px;
    z-index: 6;
  }
  .bridge-segment {
    flex: 1;
    background: rgba(0,0,0,0.1);
    border-top: 5px dashed rgba(255,255,255,0.5);
    transition: all 0.3s;
    position: relative;
  }
  .bridge-segment.active {
    background: var(--bridge);
    border-top: 5px solid #A0522D;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }
  .bridge-segment.failed {
    animation: shake 0.5s;
    background: rgba(231, 76, 60, 0.3);
  }

  @keyframes shake {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(5px); }
    75% { transform: translateY(-5px); }
  }

  /* UI Panel */
  #ui-panel {
    position: absolute;
    top: 50px;
    width: 90%;
    max-width: 800px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    text-align: center;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .sentence-area {
    font-size: 1.8rem;
    font-weight: 800;
    color: #2c3e50;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .blank {
    display: inline-block;
    min-width: 120px;
    border-bottom: 4px solid var(--primary);
    color: var(--primary);
    padding: 0 10px;
  }

  .options-grid {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  .option-btn {
    background: #fff;
    border: 3px solid #ddd;
    border-radius: 15px;
    padding: 12px 25px;
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    color: #555;
  }
  .option-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-3px);
  }
  .option-btn.correct { background: var(--correct); color: white; border-color: var(--correct); }
  .option-btn.wrong { background: var(--wrong); color: white; border-color: var(--wrong); }

  /* Screens */
  #start-screen, #end-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
  }
  .btn-big {
    background: var(--secondary);
    border: none;
    color: white;
    padding: 15px 45px;
    font-size: 1.8rem;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 30px;
    font-weight: 900;
    transition: transform 0.2s;
  }
  .btn-big:hover { transform: scale(1.1); }

  .home-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 30;
    background: rgba(255,255,255,0.3);
    color: white;
    text-decoration: none;
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
  }

  .progress-hint {
    color: #7f8c8d;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<a href="index.html#p2" class="home-btn btn-hover">🏠 返回</a>

<div id="game-viewport">
  <div class="mountain left btn-hover"></div>
  <div class="mountain right btn-hover"></div>
  
  <div id="ui-panel">
    <div class="progress-hint btn-hover" id="progressText">準備跨越邏輯之橋 (0/5)</div>
    <div class="sentence-area btn-hover" id="sentenceDisplay">
      載入中...
    </div>
    <div class="options-grid btn-hover" id="optionsGrid"></div>
  </div>

  <div id="character">🚶</div>
  
  <div class="cliff left btn-hover"></div>
  <div id="bridge-container">
    <div class="bridge-segment btn-hover" id="seg0"></div>
    <div class="bridge-segment btn-hover" id="seg1"></div>
    <div class="bridge-segment btn-hover" id="seg2"></div>
    <div class="bridge-segment btn-hover" id="seg3"></div>
    <div class="bridge-segment btn-hover" id="seg4"></div>
    <div class="bridge-segment btn-hover" id="seg5"></div>
  </div>
  <div class="cliff right btn-hover"></div>

  <!-- Screens -->
  <div id="start-screen">
    <h1 style="font-size: 3.5rem;">🌉 Logic Bridge</h1>
    <p style="font-size: 1.2rem; margin-top: 15px;">運用邏輯連接詞搭建橋樑。<br>幫助小人成功抵達彼岸吧！</p>
    <button class="btn-big btn-hover" onclick="startGame()">開始搭建</button>
  </div>

  <div id="end-screen" style="display:none">
    <h1 id="endTitle">成功抵達！</h1>
    <p style="font-size: 1.2rem; margin: 20px 0;">你對邏輯連接詞的掌握非常熟練。</p>
    <div style="font-size: 4rem;">🏆</div>
    <button class="btn-big btn-hover" onclick="location.reload()">再次挑戰</button>
    <a href="index.html#p2" style="color: #eee; margin-top: 20px; display: block; text-decoration: none;">返回主選單</a>
  </div>
</div>

<script>
const PROGRESS_KEY = 'progress_g6';
const GAME_ID = 'game2';
let currentStep = 0;
let totalSteps = 6;
let pool = [];
let currentQuestion = null;
let questionAnswered = false;

// 載入 Phase 2 (Units 7-11) 的句子
async function loadData() {
  try {
    const res = await fetch('../vocab_g6.json');
    const data = await res.json();
    // 獲取 Unit 7-11 的句子
    const phase2Units = data.slice(6, 11);
    pool = phase2Units.flatMap(u => u.sentences);
    // 隨機排序
    pool.sort(() => Math.random() - 0.5);
  } catch (e) {
    console.warn("Data load failed, fallback active:", e);
    pool = [
      ["分類", "I like apples ___ they are sweet.", "I like apples because they are sweet."],
      ["分類", "He was tired ___ he went to sleep.", "He was tired so he went to sleep."],
      ["分類", "She studied hard ___ she failed.", "She studied hard but she failed."]
    ];
  }
}

function nextQuestion() {
  if (currentStep >= totalSteps) {
    winGame();
    return;
  }
  questionAnswered = false;

  currentQuestion = pool[currentStep % pool.length];
  const fullSentence = currentQuestion[2]; // 正確答案句
  const blankText = currentQuestion[1];   // 挖空句
  const correctAnswer = currentQuestion[2].match(new RegExp(currentQuestion[2].replace(currentQuestion[1].replace('___', '(.*)'), '$1')))?.[1] || "";
  
  // 找出正確的連接詞 (根據 ___ 的位置與前後文推斷)
  // vocab_g6.json 中的格式是 [分類, 挖空句, 正確句, 唸法]
  // 我們需要提取填入 ___ 的那個詞
  const partsBefore = currentQuestion[1].split('___')[0];
  const partsAfter = currentQuestion[1].split('___')[1];
  const foundWord = currentQuestion[2].replace(partsBefore, '').replace(partsAfter, '').trim();

  renderSentence(currentQuestion[1], foundWord);
  renderOptions(foundWord);
  
  document.getElementById('progressText').textContent = `正在搭建第 ${currentStep + 1} 段橋樑 (${currentStep}/${totalSteps})`;
}

function renderSentence(text, answer) {
  const display = document.getElementById('sentenceDisplay');
  display.innerHTML = text.replace('___', '<span class="blank btn-hover" id="targetBlank">?</span>');
  // 朗讀完整句子 (不含答案)
  speak(text.replace('___', '...'));
}

function renderOptions(correctAnswer) {
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  
  // 所有可能的連接詞
  const allConnectors = ['because', 'so', 'but', 'although', 'when', 'before', 'after', 'until', 'if', 'whether'];
  const options = [correctAnswer.toLowerCase()];
  
  while(options.length < 4) {
    const rand = allConnectors[Math.floor(Math.random() * allConnectors.length)];
    if (!options.includes(rand)) options.push(rand);
  }
  options.sort(() => Math.random() - 0.5);

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, correctAnswer, btn);
    grid.appendChild(btn);
  });
}

function checkAnswer(selected, correct, btn) {
  if (questionAnswered) return;
  const isCorrect = selected.toLowerCase() === correct.toLowerCase();
  const blank = document.getElementById('targetBlank');
  
  if (isCorrect) {
    questionAnswered = true;
    btn.classList.add('correct');
    blank.textContent = correct;
    blank.style.color = 'var(--correct)';
    playSound('success');
    
    // 啟用橋段
    document.getElementById(`seg${currentStep}`).classList.add('active');
    
    // 朗讀正確全句，完成後才換題
    speak(currentQuestion[2], () => {
      setTimeout(() => {
        moveCharacter();
        currentStep++;
        nextQuestion();
      }, 500); // 稍微停頓增加穩定感
    });
  } else {
    btn.classList.add('wrong');
    document.getElementById(`seg${currentStep}`).classList.add('failed');
    playSound('error');
    setTimeout(() => {
      btn.classList.remove('wrong');
      document.getElementById(`seg${currentStep}`).classList.remove('failed');
    }, 500);
  }
}

function moveCharacter() {
  const char = document.getElementById('character');
  const bridgeWidth = document.getElementById('bridge-container').offsetWidth;
  const stepSize = bridgeWidth / totalSteps;
  const currentLeft = parseInt(char.style.left) || 50;
  char.style.left = (currentLeft + stepSize) + 'px';
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  currentStep = 0;
  nextQuestion();
}

function winGame() {
  const char = document.getElementById('character');
  char.style.left = 'calc(100% - 100px)'; // 走到對面
  
  setTimeout(() => {
    document.getElementById('end-screen').style.display = 'flex';
    // 儲存進度
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
    p[GAME_ID] = 'done';
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  }, 1000);
}

loadData();
</script>
</body>
</html>
