<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js-common.js"></script>
<title>G3 Game 5 – Memory Match</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E1F5FE; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
  
  .card { height: 120px; perspective: 1000px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 100%; text-align: center;
    transition: transform 0.6s; transform-style: preserve-3d;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 15px;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { opacity: 0.6; transform: rotateY(180deg); border: 4px solid #4CAF50; }

  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-front { background: #0288D1; color: white; font-size: 3rem; }
  .card-back { background: white; transform: rotateY(180deg); border: 3px solid #0288D1; padding: 10px; }
  .card-back .word { font-size: 1.4rem; font-weight: 800; color: #01579B; }

  .stats { margin-top: 20px; font-size: 1.2rem; font-weight: 800; color: #333; }
  
  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:20px; text-align:center; background:#0288D1; color:white;">
  <a href="index.html#p3" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 Home</a>
  <h1>Memory Match</h1>
  <p>單字翻牌大賽 🃏</p>
</header>

<div class="game-container">
  <div class="stats">找到的配對: <span id="matches">0</span> / 6</div>
  <div id="loading" style="font-size:1.5rem; margin-top:50px;">載入單字中...</div>
  <div class="grid" id="grid"></div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🏆</div>
  <h2 style="font-size:2.5rem; color:#0288D1;">Great Memory!</h2>
  <p style="font-size:1.4rem; margin:10px 0;">你的記憶力驚人！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:35px; border:none; background:#0288D1; color:white; font-size:1.6rem; font-weight:900; cursor:pointer; margin-top:30px;">
    完成並回首頁
  </button>
</div>

<script>
let allItems = [];
let flippedCards = [];
let matchCount = 0;
const PROGRESS_KEY = 'progress_g3';
const GAME_ID = 'game5';

async function loadData() {
    try {
        const resp = await fetch('../vocab_g3.json');
        const units = await resp.json();
        units.forEach(u => {
            u.core_vocab.forEach(v => allItems.push({ en: v[0], zh: v[1] }));
        });
        document.getElementById('loading').style.display = 'none';
        init();
    } catch (e) { console.error(e); }
}

function init() {
  const selected = allItems.sort(() => Math.random() - 0.5).slice(0, 6);
  let deck = [];
  selected.forEach(item => {
    deck.push({ text: item.en, id: item.en });
    deck.push({ text: item.zh, id: item.en });
  });

  deck.sort(() => Math.random() - 0.5);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  deck.forEach((data) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = data.id;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">❓</div>
        <div class="card-back"><div class="word">${data.text}</div></div>
      </div>
    `;
    card.onclick = () => flipCard(card);
    grid.appendChild(card);
  });
}

function flipCard(card) {
  if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flippedCards.push(card);
  if (flippedCards.length === 2) checkMatch();
}

function checkMatch() {
  const [c1, c2] = flippedCards;
  if (c1.dataset.id === c2.dataset.id) {
    c1.classList.add('matched');
    c2.classList.add('matched');
    matchCount++;
    playSound('success');
    document.getElementById('matches').textContent = matchCount;
    speak(c1.dataset.id);
    flippedCards = [];
    if (matchCount === 6) setTimeout(() => document.getElementById('finish-screen').style.display = 'flex', 500);
  } else {
    playSound('error');
    setTimeout(() => {
      c1.classList.remove('flipped');
      c2.classList.remove('flipped');
      flippedCards = [];
    }, 1000);
  }
}

function finishGame() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress[GAME_ID] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = "index.html#p3";
}

loadData();
</script>
</body>
</html>
