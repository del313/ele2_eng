<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小三英文課程 – Grade 3</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .game-card {
    grid-column: auto !important;
    margin: 0 !important;
    flex-direction: column !important;
    padding: 15px !important;
    text-align: center !important;
  }
  .game-card .card-icon { margin-bottom: 5px; }
  .game-card .content { text-align: center !important; }
  .game-card .card-title { font-size: 1.1rem !important; }

  @media (max-width: 600px) {
    .card-grid, .game-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
  }
</style>
</head>
<body>

<header>
  <h1>🎒 小三英文校園</h1>
  <p>Grade 3 English · 12 Units</p>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 12 完成</div>
  <div class="header-btns">
    <button class="reset-progress-btn" onclick="resetProgress()">🔄 重設進度</button>
    <a href="../index.html" class="back-home-btn">🏠 回首頁</a>
  </div>
</header>

<style>
  .header-btns {
    display: flex;
    justify-content: space-between;
    margin: 15px auto 0 auto;
    max-width: 800px;
    padding: 0 20px;
    gap: 20px;
  }
  .back-home-btn, .reset-progress-btn {
    box-sizing: border-box;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    color: white;
    font-size: 13px;
    font-weight: 800;
    padding: 0;
    height: 40px;
    width: 130px;
    text-decoration: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }
  .back-home-btn:hover, .reset-progress-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
  }
</style>

<div class="container">

  <div class="continue-banner hidden" id="continueBanner">
    <div class="cb-text" style="font-size: 1.1rem;">繼續挑戰：<span id="continueTitle" style="color:#F06292"></span></div>
    <a href="#" class="cb-btn" id="continueLink" style="background:#F06292; color:white; padding:10px 20px; border-radius:30px; text-decoration:none; font-weight:800; margin-left:15px;">GO! →</a>
  </div>

  <div class="section-label">第一階段：校園與身體 (Unit 1-3)</div>
  <div class="card-grid" id="group1"></div>

  <div class="section-label" style="margin-top:40px;">第二階段：生活與食物 (Unit 4-6)</div>
  <div class="card-grid" id="group2"></div>

  <div class="section-label" style="margin-top:40px;">第三階段：環境與作息 (Unit 7-9)</div>
  <div class="card-grid" id="group3"></div>

  <div class="section-label" style="margin-top:40px;">第四階段：自然與職業 (Unit 10-12)</div>
  <div class="card-grid" id="group4"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FFF;border:3px solid #4FC3F7"></div> 準備好</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FFFDE7;border:3px solid #FFB74D"></div> 進行中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F1F8E9;border:3px solid #81C784"></div> 已完成</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ECEFF1;border:3px solid #D1D9E0"></div> 鎖定中</div>
  </div>

</div>

<script>
const units = [
  { id:'unit1',  title:'Numbers 11-20', sub:'數字 11-20', icon:'🔢', file:'unit1.html'  },
  { id:'unit2',  title:'My Body',       sub:'我的身體',   icon:'💪', file:'unit2.html'  },
  { id:'unit3',  title:'My Clothes',    sub:'我的衣服',   icon:'👕', file:'unit3.html'  },
  { id:'unit4',  title:'Fruits & Taste', sub:'水果與味道', icon:'🍓', file:'unit4.html'  },
  { id:'unit5',  title:'Healthy Veggies',sub:'健康蔬菜',   icon:'🥦', file:'unit5.html'  },
  { id:'unit6',  title:'Wild Animals',   sub:'野生動物',   icon:'🦁', file:'unit6.html'  },
  { id:'unit7',  title:'In the Classroom',sub:'在教室裡',  icon:'🏫', file:'unit7.html'  },
  { id:'unit8',  title:'Action Phrases', sub:'作息動作',   icon:'🏃', file:'unit8.html'  },
  { id:'unit9',  title:'Places in Town', sub:'城鎮地方',   icon:'🏙️', file:'unit9.html'  },
  { id:'unit10', title:'Nature & Colors',sub:'自然與色彩', icon:'🌈', file:'unit10.html' },
  { id:'unit11', title:'Weather & Needs',sub:'天氣與需求', icon:'🌧️', file:'unit11.html' },
  { id:'unit12', title:'People & Jobs',  sub:'人們與職業', icon:'👮', file:'unit12.html' },
];

const unitSequence = units.map(u => u.id);
const PROGRESS_KEY = 'progress_g3';
const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');

window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

function resetProgress() {
  if (confirm('確定要清除所有進度嗎？')) {
    localStorage.removeItem(PROGRESS_KEY);
    location.reload();
  }
}

function getState(id) {
  if (progress[id] === 'done') return 'done';
  if (progress[id] === 'in_progress') return 'in-progress';
  const idx = unitSequence.indexOf(id);
  if (idx === 0) return 'available';
  const prev = unitSequence[idx - 1];
  if (progress[prev] === 'done') return 'available';
  return 'locked';
}

function makeUnitCard(u, num) {
  const state = getState(u.id);
  const a = document.createElement('a');
  a.className = `unit-card ${state}`;
  a.href = state === 'locked' ? '#' : u.file;
  if (state === 'locked') a.onclick = e => e.preventDefault();
  
  const badge = state === 'done' ? '⭐' : state === 'in-progress' ? '▶️' : state === 'locked' ? '🔒' : '';
  a.innerHTML = `
    ${badge ? `<div class="card-badge">${badge}</div>` : ''}
    <div class="card-num">UNIT ${num}</div>
    <div class="card-icon">${u.icon}</div>
    <div class="card-title">${u.title}</div>
    <div class="card-sub">${u.sub}</div>`;
  return a;
}

[units.slice(0,3), units.slice(3,6), units.slice(6,9), units.slice(9,12)].forEach((group, gi) => {
  const grid = document.getElementById(`group${gi+1}`);
  if (grid) {
    group.forEach((u, i) => grid.appendChild(makeUnitCard(u, gi*3 + i + 1)));
  }
});

const total = unitSequence.length;
const done = unitSequence.filter(id => progress[id] === 'done').length;
document.getElementById('progressBar').style.width = `${Math.round(done/total*100)}%`;
document.getElementById('progressLabel').textContent = `${done} / ${total} 完成`;

const target = unitSequence.find(id => progress[id] !== 'done');
if (target) {
  const state = getState(target);
  if (state !== 'locked') {
    const banner = document.getElementById('continueBanner');
    banner.classList.remove('hidden');
    banner.style.display = 'flex';
    const u = units.find(x => x.id === target);
    if (u) {
      document.getElementById('continueTitle').textContent = u.title;
      document.getElementById('continueLink').href = u.file;
    }
  }
}
</script>
</body>
</html>
