<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js-common.js"></script>
<title>G3 Game 4 – Bubble Pop</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E0F7FA; overflow: hidden; touch-action: manipulation; }
  .game-header { background: #00BCD4; color: white; padding: 15px; text-align: center; position: relative; z-index: 10; }
  .home-btn { position: absolute; left: 15px; top: 15px; color: white; text-decoration: none; font-weight: 800; }
  
  .target-display {
    background: white; margin: 10px auto; padding: 10px 20px; border-radius: 20px;
    display: inline-block; font-size: 2rem; font-weight: 900; color: #00838F;
    border: 3px solid #00BCD4; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .bubble-container { position: relative; width: 100vw; height: calc(100vh - 120px); }
  
  .bubble {
    position: absolute; width: 130px; height: 130px;
    background: rgba(255, 255, 255, 0.4); border: 2px solid rgba(255,255,255,0.8);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: inset -10px -10px 20px rgba(255,255,255,0.3);
    animation: floatUp 8s linear infinite; text-align: center;
    transition: transform 0.1s;
  }
  .bubble:active { transform: scale(0.8); }
  .bubble .icon { font-size: 3rem; display: block; line-height: 1; }
  .bubble .word { font-size: 1.2rem; font-weight: 900; display: block; color: #006064; }
  
  @keyframes floatUp {
    from { transform: translateY(100vh) translateX(0); }
    to { transform: translateY(-20vh) translateX(20px); }
  }

  #score-panel { position: fixed; bottom: 20px; right: 20px; font-size: 1.5rem; font-weight: 900; color: #00838F; background: white; padding: 5px 15px; border-radius: 20px; }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
</style>
</head>
<body>

<header class="game-header">
  <a href="index.html" class="home-btn">🏠 Home</a>
  <h1>Bubble Pop</h1>
  <div class="target-display" id="target-word">載入中...</div>
</header>

<div class="bubble-container" id="bubble-area"></div>
<div id="score-panel">第 <span id="q-num">1</span> / 10 題</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🫧</div>
  <h2 style="font-size:2.5rem; color:#00BCD4;">Bubble Master!</h2>
  <p style="font-size:1.4rem; margin:10px 0;">你成功捕捉了所有單字泡泡！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:35px; border:none; background:#00BCD4; color:white; font-size:1.6rem; font-weight:900; cursor:pointer; margin-top:30px;">
    完成並回首頁
  </button>
</div>

<script>
let gameItems = [];
let score = 0;
let targetItem = null;
let lastTargets = [];
let bubbleCount = 0;
const PROGRESS_KEY = 'progress_g3';
const GAME_ID = 'game4';

async function loadData() {
    try {
        const resp = await fetch('../vocab_g3.json');
        if (!resp.ok) throw new Error();
        const units = await resp.json();
        units.forEach(u => {
            u.core_vocab.forEach(v => {
                gameItems.push({ text: v[0], icon: u.icon });
            });
        });
    } catch (e) {
        console.warn("Fallback active");
        gameItems = [
            { text: "ELEVEN", icon: "🔢" }, { text: "TWELVE", icon: "🔢" },
            { text: "ARM", icon: "💪" }, { text: "LEG", icon: "💪" },
            { text: "SHIRT", icon: "👕" }, { text: "DRESS", icon: "👕" }
        ];
    }
    if (gameItems.length > 0) {
        nextRound();
        setInterval(createBubble, 1500);
    }
}

function nextRound() {
  if (gameItems.length === 0) return;
  let idx;
  do {
    idx = Math.floor(Math.random() * gameItems.length);
  } while (lastTargets.includes(idx) && gameItems.length > 3);

  lastTargets.push(idx);
  if (lastTargets.length > 2) lastTargets.shift();

  targetItem = gameItems[idx];
  document.getElementById('target-word').textContent = `Find: ${targetItem.text}`;
  document.getElementById('q-num').textContent = score + 1;
  speak(targetItem.text);
}

function createBubble() {
  if (gameItems.length === 0) return;
  const area = document.getElementById('bubble-area');
  const bubble = document.createElement('div');
  
  bubbleCount++;
  let item;
  if (bubbleCount >= 10) {
    item = targetItem;
    bubbleCount = 0;
  } else {
    item = gameItems[Math.floor(Math.random() * gameItems.length)];
    if (item.text === targetItem.text) bubbleCount = 0;
  }
  
  bubble.className = 'bubble';
  bubble.style.left = Math.random() * 70 + 'vw';
  bubble.style.animationDuration = (Math.random() * 4 + 4) + 's';
  bubble.innerHTML = `<div><span class="icon">${item.icon}</span><span class="word">${item.text}</span></div>`;
  
  bubble.onclick = () => {
    if (item.text === targetItem.text) {
      score++;
      playSound('success');
      bubble.style.transform = 'scale(2)';
      bubble.style.opacity = '0';
      setTimeout(() => bubble.remove(), 200);
      
      if (score >= 10) {
        document.getElementById('finish-screen').style.display = 'flex';
      } else {
        nextRound();
      }
    } else {
      playSound('error');
      bubble.style.background = 'rgba(255, 0, 0, 0.3)';
      setTimeout(() => { bubble.style.background = 'rgba(255, 255, 255, 0.4)'; }, 300);
      speak(targetItem.text);
    }
  };

  area.appendChild(bubble);
  setTimeout(() => { if(bubble.parentElement) bubble.remove(); }, 8000);
}

function finishGame() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress[GAME_ID] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = 'index.html';
}

loadData();
</script>
</body>
</html>
