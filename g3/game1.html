<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js-common.js"></script>
<title>G3 Game 1 – Spelling Bee</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E8F5E9; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  #q-info { font-size: 1.2rem; font-weight: 800; color: #2E7D32; margin-bottom: 15px; }
  .hint-box { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .zh-hint { font-size: 2rem; font-weight: 900; color: #2E7D32; margin-bottom: 10px; }
  .speak-hint { margin-bottom: 10px; }
  
  .scrambled-area { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; min-height: 60px; }
  .letter-tile {
    width: 50px; height: 50px; background: #C8E6C9; border: 3px solid #2E7D32;
    border-radius: 12px; font-size: 1.8rem; font-weight: 800; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    transition: all 0.2s; color: #1B5E20;
  }
  .letter-tile:hover { transform: scale(1.1); background: #A5D6A7; }
  
  .answer-area {
    min-height: 70px; border-bottom: 5px solid #2E7D32;
    display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
    align-items: flex-end; padding-bottom: 5px;
  }
  
  .ans-tile { color: #1B5E20; font-size: 2.2rem; font-weight: 900; min-width: 30px; }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.98); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:20px; text-align:center; background:#2E7D32; color:white;">
  <a href="index.html" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 Home</a>
  <h1>Spelling Bee</h1>
  <p>拼字小蜜蜂 🐝</p>
</header>

<div class="game-container">
  <div id="q-info">第 <span id="q-num">1</span> / 10 題</div>
  <div class="hint-box">
    <div class="zh-hint" id="zh-hint">載入中...</div>
    <div class="speak-hint">
        <button onclick="playCurrentWord()" style="background:#2E7D32; color:white; border:none; padding:10px 20px; border-radius:30px; font-weight:800; cursor:pointer;">
            🔊 聽發音
        </button>
    </div>
  </div>
  
  <div class="answer-area" id="answer-area"></div>
  
  <div class="scrambled-area" id="scrambled-area"></div>
  
  <button onclick="clearAnswer()" style="padding:12px 30px; border-radius:30px; border:none; background:#EEE; color:#666; font-weight:800; cursor:pointer; margin-top:10px;">
    ❌ 清除重拼
  </button>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🐝</div>
  <h2 style="font-size:2.5rem; color:#2E7D32;">Wonderful!</h2>
  <p style="font-size:1.4rem; margin:10px 0;">你拼對了所有單字！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:35px; border:none; background:#2E7D32; color:white; font-size:1.6rem; font-weight:900; cursor:pointer; margin-top:30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
    完成並回首頁
  </button>
</div>

<script>
let allWords = [];
let shuffledQueue = [];
let currentIdx = 0;
let userAns = "";
const PROGRESS_KEY = 'progress_g3';
const GAME_ID = 'game1';

async function loadData() {
    try {
        const resp = await fetch('../vocab_g3.json');
        if (!resp.ok) throw new Error("Fetch failed");
        const units = await resp.json();
        units.forEach(u => {
            u.core_vocab.forEach(v => {
                allWords.push({ en: v[0].toUpperCase(), zh: v[1] });
            });
        });
    } catch (e) {
        console.warn("Using fallback data for local file access.");
        // Fallback data for local direct open
        const fallback = [
            ["eleven", "十一"], ["twelve", "十二"], ["arm", "手臂"], ["leg", "腿"],
            ["shirt", "襯衫"], ["dress", "洋裝"], ["apple", "蘋果"], ["banana", "香蕉"],
            ["carrot", "胡蘿蔔"], ["corn", "玉米"], ["lion", "獅子"], ["tiger", "老虎"]
        ];
        fallback.forEach(v => allWords.push({ en: v[0].toUpperCase(), zh: v[1] }));
    }
    init();
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function init() {
  shuffledQueue = shuffle([...allWords]).slice(0, 10); // 每次玩 10 題
  nextRound();
}

function nextRound() {
  if (currentIdx >= shuffledQueue.length) {
    document.getElementById('finish-screen').style.display = 'flex';
    return;
  }
  
  userAns = "";
  const word = shuffledQueue[currentIdx];
  document.getElementById('q-num').textContent = currentIdx + 1;
  document.getElementById('zh-hint').textContent = word.zh;
  
  // 顯示底線
  const ansDiv = document.getElementById('answer-area');
  ansDiv.innerHTML = word.en.split('').map(() => `<span class="ans-tile">_</span>`).join(' ');
  
  // 顯示打亂的字母
  const letters = word.en.split('');
  const scrambled = shuffle([...letters]);
  const area = document.getElementById('scrambled-area');
  area.innerHTML = '';
  scrambled.forEach((l, idx) => {
    const div = document.createElement('div');
    div.className = 'letter-tile';
    div.textContent = l;
    div.onclick = () => addLetter(l, div);
    area.appendChild(div);
  });
  
  playCurrentWord();
}

function playCurrentWord() {
    if (shuffledQueue[currentIdx]) {
        speak(shuffledQueue[currentIdx].en);
    }
}

function addLetter(l, el) {
  if (el.style.visibility === 'hidden') return;
  userAns += l;
  el.style.visibility = 'hidden';
  
  const target = shuffledQueue[currentIdx].en;
  const ansDiv = document.getElementById('answer-area');
  
  // 更新畫面
  ansDiv.innerHTML = userAns.split('').map(char => `<span class="ans-tile">${char}</span>`).join(' ') + 
                    target.slice(userAns.length).split('').map(() => `<span class="ans-tile">_</span>`).join(' ');

  if (userAns.length === target.length) {
    if (userAns === target) {
      playSound('success');
      currentIdx++;
      setTimeout(nextRound, 800);
    } else {
      playSound('error');
      setTimeout(clearAnswer, 400);
    }
  }
}

function clearAnswer() {
  userAns = "";
  document.querySelectorAll('.letter-tile').forEach(t => t.style.visibility = 'visible');
  const target = shuffledQueue[currentIdx].en;
  document.getElementById('answer-area').innerHTML = target.split('').map(() => `<span class="ans-tile">_</span>`).join(' ');
}

function finishGame() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress[GAME_ID] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = 'index.html';
}

loadData();
</script>
</body>
</html>
