<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文學習入口網 - English Learning Portal</title>
<style>
  :root {
    --primary: #4A90E2;
    --secondary: #50E3C2;
    --accent: #F5A623;
    --bg: #F8F9FA;
    --card-bg: #FFFFFF;
    --text: #333333;
    --muted: #666666;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 2.5rem;
    color: var(--primary);
    margin-bottom: 10px;
    font-weight: 900;
  }

  header p {
    font-size: 1.1rem;
    color: var(--muted);
  }

  .portal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1000px;
    width: 100%;
  }

  .portal-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 3px solid transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 320px;
  }

  .portal-card:hover:not(.locked) {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px rgba(74,144,226,0.15);
    border-color: var(--primary);
  }

  .card-icon {
    font-size: 4rem;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 10px;
    color: var(--primary);
  }

  .card-desc {
    font-size: 1rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .portal-card.g2 { border-top: 8px solid #FF8C00; }
  .portal-card.g4 { border-top: 8px solid #F5A623; }
  .portal-card.kinder { border-top: 8px solid #50E3C2; }

  .portal-card.locked {
    opacity: 0.7;
    cursor: not-allowed;
    background: #eeeeee;
  }

  /* Progress Styles */
  .progress-container {
    margin-top: 20px;
    background: #eee;
    border-radius: 10px;
    height: 10px;
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.6s ease;
  }
  .progress-text {
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 6px;
    color: var(--muted);
  }
  .portal-card.kinder .progress-bar { background: var(--secondary); }
  .portal-card.g2 .progress-bar { background: #FF8C00; }
  .portal-card.g4 .progress-bar { background: var(--accent); }

  .locked-badge {
    display: inline-block;
    background: #999;
    color: white;
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 0.8rem;
    margin-top: 10px;
    font-weight: bold;
  }

  .footer {
    margin-top: auto;
    padding-top: 40px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
    .portal-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 英文學習樂園</h1>
  <p>選擇適合您的學習階段，開始冒險吧！</p>
</header>

<div class="portal-grid">
  <!-- Kindergarten -->
  <a href="gk/index.html" class="portal-card kinder">
    <div class="card-icon">🐣</div>
    <div class="card-title">幼兒園英文</div>
    <div class="card-desc">建立英文好感度<br>聽力與遊戲啟蒙</div>
    <div class="progress-container"><div id="progress-gk" class="progress-bar"></div></div>
    <div id="text-gk" class="progress-text">尚未開始</div>
  </a>

  <!-- Grade 2 -->
  <a href="g2/index.html" class="portal-card g2">
    <div class="card-icon">🎨</div>
    <div class="card-title">小二英文冒險</div>
    <div class="card-desc">基礎單字與句型練習<br>適合 7-8 歲兒童</div>
    <div class="progress-container"><div id="progress-g2" class="progress-bar"></div></div>
    <div id="text-g2" class="progress-text">尚未開始</div>
  </a>

  <!-- Grade 3 -->
  <a href="#" class="portal-card g3 locked">
    <div class="card-icon">🎒</div>
    <div class="card-title">小三英文校園</div>
    <div class="card-desc">校園生活與日常作息<br>螺旋式進階學習</div>
    <div class="progress-container"><div id="progress-g3" class="progress-bar"></div></div>
    <div id="text-g3" class="progress-text">尚未開始</div>
    <div class="locked-badge">製作中</div>
  </a>

  <!-- Grade 4 -->
  <a href="g4/index.html" class="portal-card g4">
    <div class="card-icon">🚀</div>
    <div class="card-title">小四英文課程</div>
    <div class="card-desc">進階溝通與情境對話<br>適合 9-10 歲兒童</div>
    <div class="progress-container"><div id="progress-g4" class="progress-bar"></div></div>
    <div id="text-g4" class="progress-text">尚未開始</div>
  </a>

  <!-- Grade 5 -->
  <a href="#" class="portal-card g5 locked">
    <div class="card-icon">🎭</div>
    <div class="card-title">小五英文應用</div>
    <div class="card-desc">社交情境與語法邏輯<br>適合 11 歲兒童</div>
    <div class="progress-container"><div id="progress-g5" class="progress-bar"></div></div>
    <div id="text-g5" class="progress-text">尚未開始</div>
    <div class="locked-badge">規劃中</div>
  </a>

  <!-- Grade 6 -->
  <a href="#" class="portal-card g6 locked">
    <div class="card-icon">🎓</div>
    <div class="card-title">小六英文衝刺</div>
    <div class="card-desc">學術準備與時態挑戰<br>銜接國中課程</div>
    <div class="progress-container"><div id="progress-g6" class="progress-bar"></div></div>
    <div id="text-g6" class="progress-text">尚未開始</div>
    <div class="locked-badge">規劃中</div>
  </a>
</div>

<div class="footer">
  &copy; 2026 英文學習樂園. All rights reserved.
</div>

<script>
  function updateProgress() {
    const configs = [
      { id: 'gk', key: 'progress_kinder', total: 8, label: '幼兒園' },
      { id: 'g2', key: 'progress_g2', total: 12, label: '小二' },
      { id: 'g3', key: 'progress_g3', total: 12, label: '小三' },
      { id: 'g4', key: 'progress_g4', total: 12, label: '小四' },
      { id: 'g5', key: 'progress_g5', total: 15, label: '小五' },
      { id: 'g6', key: 'progress_g6', total: 18, label: '小六' }
    ];

    configs.forEach(conf => {
      try {
        const progressData = JSON.parse(localStorage.getItem(conf.key) || '{}');
        let completedCount = 0;
        
        if (progressData && typeof progressData === 'object' && !Array.isArray(progressData)) {
          // 統計物件中標記為 'done' 的單元數量
          completedCount = Object.values(progressData).filter(v => v === 'done').length;
        } else if (Array.isArray(progressData)) {
          // 相容舊有的陣列模式 (如果有的話)
          completedCount = progressData.length;
        }

        const percent = Math.min(100, Math.round((completedCount / conf.total) * 100));
        
        const bar = document.getElementById(`progress-${conf.id}`);
        const text = document.getElementById(`text-${conf.id}`);
        
        if (bar) bar.style.width = percent + '%';
        if (text) {
          if (percent === 100) {
            text.innerHTML = '✨ 已全部完成！';
            text.style.color = '#4CAF50';
          } else if (percent > 0) {
            text.innerHTML = `已完成 ${percent}% (${completedCount}/${conf.total})`;
          } else {
            text.innerHTML = '尚未開始';
          }
        }
      } catch (e) {
        console.error('Progress calculation error:', e);
      }
    });
  }

  // 頁面載入時執行
  window.addEventListener('load', updateProgress);
  // 如果是從子分頁返回，也要重新整理進度
  window.addEventListener('pageshow', updateProgress);

  // 註冊 Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('SW registered:', reg);
      }).catch(err => {
        console.log('SW registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
