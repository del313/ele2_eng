<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二單元 – 數字 1-10</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { display: flex; flex-direction: column; background: #fff; }
  .unit-header {
    background: linear-gradient(135deg, var(--blue), var(--green));
    color: white; padding: 20px; text-align: center; position: relative;
  }
  .home-btn {
    position: absolute; top: 15px; left: 15px;
    background: rgba(255,255,255,0.3); border: none; padding: 8px 15px;
    border-radius: 20px; color: white; text-decoration: none; font-weight: 800;
  }

  .step-nav { display: flex; background: #F8F9FA; border-bottom: 2px solid #EEE; }
  .step-btn {
    flex: 1; padding: 12px; border: none; background: none; cursor: pointer;
    font-size: 14px; font-weight: 800; color: var(--muted);
    transition: all 0.2s; border-bottom: 4px solid transparent;
  }
  .step-btn.active { color: var(--blue); border-bottom-color: var(--blue); background: #E1F5FE; }

  .page { display: none; padding: 25px 20px 100px; max-width: 600px; margin: 0 auto; width: 100%; animation: fadeIn 0.4s; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .page-title { font-size: 1.8rem; font-weight: 900; color: var(--blue); margin-bottom: 20px; text-align: center; }

  .video-btn {
    display: block; background: #FF0000; color: white; text-align: center;
    padding: 20px; border-radius: 20px; text-decoration: none; font-size: 1.2rem;
    font-weight: 800; margin: 20px 0; box-shadow: 0 4px 15px rgba(255,0,0,0.3);
  }

  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .vocab-card {
    background: #F0F9FF; border-radius: 20px; padding: 15px; text-align: center;
    border: 3px solid var(--blue); cursor: pointer; transition: 0.2s;
  }
  .vocab-card:hover { transform: scale(1.05); }
  .vocab-card .icon { font-size: 3rem; display: block; color: var(--pink); font-weight: 900; }
  .vocab-card .word { font-size: 1.3rem; font-weight: 900; color: var(--text); margin-top: 5px; }

  .quiz-img { font-size: 6rem; text-align: center; margin-bottom: 20px; color: var(--pink); font-weight: 900; }
  .quiz-options { display: grid; gap: 10px; }
  .opt-btn {
    padding: 15px; border-radius: 15px; border: 3px solid #DDD;
    background: white; font-size: 1.2rem; font-weight: 800; cursor: pointer;
  }
  .opt-btn.correct { background: var(--green); color: white; border-color: #2E7D32; }
  .opt-btn.wrong { background: var(--pink); color: white; border-color: #C2185B; animation: shake 0.3s; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 15px; background: white; border-top: 2px solid #EEE;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .nav-btn {
    flex: 1; padding: 15px; border-radius: 15px; border: none;
    font-size: 1.1rem; font-weight: 900; cursor: pointer;
  }
  .btn-next { background: var(--blue); color: white; }
  .btn-prev { background: #EEE; color: var(--muted); }

  .finish-icon { font-size: 8rem; animation: star-pop 0.6s infinite alternate; text-align: center; }
  @keyframes star-pop { from { transform: scale(1); } to { transform: scale(1.2); } }
</style>
</head>
<body onload="init()">

<header class="unit-header">
  <a href="index.html" class="home-btn">🏠 首頁</a>
  <h1>第二單元</h1>
  <p>數字 1-10</p>
</header>

<nav class="step-nav">
  <button class="step-btn active" onclick="showPage(0)">1. 觀看影片</button>
  <button class="step-btn" onclick="showPage(1)">2. 學習單字</button>
  <button class="step-btn" onclick="showPage(2)">3. 小小測驗</button>
  <button class="step-btn" onclick="showPage(3)">4. 開口練習</button>
  <button class="step-btn" onclick="showPage(4)">5. 完成！</button>
</nav>

<!-- PAGE 1: WATCH -->
<div class="page active" id="page0">
  <h2 class="page-title">數數歌</h2>
  <div style="text-align:center; margin-bottom:20px;">
    <p style="font-size:1.1rem; font-weight:600;">跟著音樂一起數 1 到 10 吧！</p>
  </div>

  <div style="text-align:center;">
    <a href="https://www.youtube.com/watch?v=DR-cfDsHCGA" class="video-btn">
      📺 按這裡播放影片
    </a>
  </div>

  <div style="background:#FFF9C4; padding:20px; border-radius:20px; border:2px dashed #FBC02D; margin-top:20px;">
    <strong>任務：</strong> 聽聽看數字 1-10 的唸法。
  </div>
</div>

<!-- PAGE 2: WORDS -->
<div class="page" id="page1">
  <h2 class="page-title">新單字</h2>
  <div class="vocab-grid" id="vocab-grid">
    <!-- Will be injected by JS -->
  </div>
</div>

<!-- PAGE 3: QUIZ -->
<div class="page" id="page2">
  <h2 class="page-title">測驗時間</h2>
  <div id="quiz-container"></div>
</div>

<!-- PAGE 4: SPEAK -->
<div class="page" id="page3">
  <h2 class="page-title">跟著說說看</h2>
  <div id="speak-container"></div>
</div>

<!-- PAGE 5: FINISH -->
<div class="page" id="page4">
  <h2 class="page-title">做得好！</h2>
  <div class="finish-icon">🏆</div>
  <div style="text-align:center; margin-top:30px;">
    <p style="font-size:1.3rem; font-weight:800;">你已經學會數字 1-10 了！</p>
    <button onclick="finishUnit()" style="margin-top:20px; width:100%; padding:20px; border-radius:20px; border:none; background:var(--green); color:white; font-size:1.5rem; font-weight:900; cursor:pointer;">
      ✅ 結束並領取獎勵
    </button>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn btn-prev" id="prevBtn" onclick="prevPage()">上一步</button>
  <button class="nav-btn btn-next" id="nextBtn" onclick="nextPage()">下一步</button>
</div>

<script>
let currentPage = 0;
const totalPages = 5;
const PROGRESS_KEY = 'progress_g2';
const UNIT_ID = 'unit2';

const vocab = [
  { word: 'One',   icon: '1' },
  { word: 'Two',   icon: '2' },
  { word: 'Three', icon: '3' },
  { word: 'Four',  icon: '4' },
  { word: 'Five',  icon: '5' },
  { word: 'Six',   icon: '6' },
  { word: 'Seven', icon: '7' },
  { word: 'Eight', icon: '8' },
  { word: 'Nine',  icon: '9' },
  { word: 'Ten',   icon: '10' }
];

const sentences = [
  "I have one apple.",
  "I see two bears.",
  "Let's count to ten!"
];

let quizQuestions = [];
let currentQuizIndex = 0;
let currentSpeakIndex = 0;

function init() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  if (progress[UNIT_ID] !== 'done') {
    progress[UNIT_ID] = 'in_progress';
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  }
  
  renderVocab();
  // 5 questions (half of vocab)
  quizQuestions = [...vocab].sort(() => 0.5 - Math.random()).slice(0, 5);
  
  updateNav();
}

function renderVocab() {
  const grid = document.getElementById('vocab-grid');
  grid.innerHTML = vocab.map(v => `
    <div class="vocab-card" onclick="speak('${v.word}')">
      <span class="icon">${v.icon}</span>
      <span class="word">${v.word}</span>
    </div>
  `).join('');
}

function showPage(idx) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page' + idx).classList.add('active');
  document.querySelectorAll('.step-btn')[idx].classList.add('active');
  currentPage = idx;

  if (idx === 2) { currentQuizIndex = 0; renderQuiz(); }
  if (idx === 3) { currentSpeakIndex = 0; renderSpeak(); }

  updateNav();
  window.scrollTo(0,0);
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  const q = quizQuestions[currentQuizIndex];
  const others = vocab.filter(v => v.word !== q.word).sort(() => 0.5 - Math.random()).slice(0, 2);
  const options = [...others, q].sort(() => 0.5 - Math.random());

  container.innerHTML = `
    <div style="text-align:right; font-weight:bold; color:var(--muted); margin-bottom:10px;">
      題次: ${currentQuizIndex + 1} / ${quizQuestions.length}
    </div>
    <div class="quiz-img">${q.icon}</div>
    <div class="quiz-options">
      ${options.map(opt => `
        <button class="opt-btn" onclick="checkAnswer(this, ${opt.word === q.word})">${opt.word}</button>
      `).join('')}
    </div>
  `;
}

function checkAnswer(btn, isCorrect) {
  if (isCorrect) {
    btn.classList.add('correct');
    speak('Correct!');
    setTimeout(() => {
      if (currentQuizIndex < quizQuestions.length - 1) {
        currentQuizIndex++;
        renderQuiz();
      } else {
        nextPage();
      }
    }, 1000);
  } else {
    btn.classList.add('wrong');
    speak('Try again!');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

function renderSpeak() {
  const container = document.getElementById('speak-container');
  const s = sentences[currentSpeakIndex];
  container.innerHTML = `
    <div style="text-align:right; font-weight:bold; color:var(--muted); margin-bottom:10px;">
      練習: ${currentSpeakIndex + 1} / ${sentences.length}
    </div>
    <div style="text-align:center; padding:20px;">
      <div style="font-size:4rem; margin-bottom:20px;">🗣️</div>
      <p style="font-size:1.8rem; font-weight:900; color:var(--blue); margin-bottom:30px;">${s}</p>
      <button onclick="speak('${s}')" style="padding:15px 40px; border-radius:30px; border:none; background:var(--orange); color:white; font-size:1.3rem; font-weight:800; cursor:pointer; box-shadow: 0 4px 10px rgba(255,152,0,0.3);">
        🔊 聽聽看並跟讀
      </button>
      ${currentSpeakIndex < sentences.length - 1 
        ? `<button onclick="nextSpeak()" style="display:block; margin: 30px auto 0; background:none; border:none; color:var(--blue); font-weight:800; cursor:pointer; font-size:1.1rem;">下一個句型 ➔</button>`
        : `<p style="margin-top:30px; color:var(--green); font-weight:800;">✨ 挑戰成功！</p>`
      }
    </div>
  `;
}

function nextSpeak() {
  if (currentSpeakIndex < sentences.length - 1) {
    currentSpeakIndex++;
    renderSpeak();
  }
}

function nextPage() { if (currentPage < totalPages - 1) showPage(currentPage + 1); }
function prevPage() { if (currentPage > 0) showPage(currentPage - 1); }

function updateNav() {
  document.getElementById('prevBtn').style.visibility = currentPage === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').style.display = currentPage === totalPages - 1 ? 'none' : 'block';
}

function speak(text) {
  const msg = new SpeechSynthesisUtterance();
  msg.text = text;
  msg.lang = 'en-US';
  msg.rate = 0.8;
  window.speechSynthesis.speak(msg);
}

function finishUnit() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress[UNIT_ID] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = 'index.html';
}
</script>
</body>
</html>
