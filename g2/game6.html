<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js-common.js"></script>
<title>Game 6 – Speed Race</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E8EAF6; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .timer-bar { width: 100%; height: 20px; background: #DDD; border-radius: 10px; margin: 20px 0; overflow: hidden; }
  .timer-fill { width: 100%; height: 100%; background: var(--blue); transition: width 0.1s linear; }

  .q-img { font-size: 6rem; margin: 30px 0; }
  
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .opt-btn {
    background: white; border: 3px solid var(--blue); border-radius: 20px;
    padding: 20px; font-size: 1.5rem; font-weight: 800; cursor: pointer; transition: 0.2s;
  }
  .opt-btn:hover { background: var(--blue); color: white; }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:20px; text-align:center; background:var(--blue); color:white;">
  <a href="index.html" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 Home</a>
  <h1>Speed Race</h1>
  <p>單字賽車手</p>
</header>

<div class="game-container">
  <div style="font-size:1.2rem; font-weight:800; color:var(--blue);">得分: <span id="score">0</span> / 10</div>
  <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
  
  <div class="q-img" id="q-img">🚗</div>
  
  <div class="opt-grid" id="opt-grid"></div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🏁</div>
  <h2 style="font-size:2rem; color:var(--blue);">You are Fast!</h2>
  <p style="font-size:1.2rem; margin:10px 0;">你是一個厲害的賽車手！</p>
  <button onclick="finishGame()" style="padding:15px 40px; border-radius:30px; border:none; background:var(--green); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; margin-top:20px;">
    完成並回首頁
  </button>
</div>

<script>
const words = [
  { w: 'Car', i: '🚗' }, { w: 'Bike', i: '🚲' }, { w: 'Bus', i: '🚌' },
  { w: 'Train', i: '🚆' }, { w: 'Ship', i: '🚢' }, { w: 'Plane', i: '✈️' },
  { w: 'Apple', i: '🍎' }, { w: 'Banana', i: '🍌' }, { w: 'Grape', i: '🍇' }
];

let score = 0;
let currentItem = null;
let timerInterval;
let timerWidth = 100;
const PROGRESS_KEY = 'progress_g2';

function init() {
  nextRound();
}

function nextRound() {
  if (score >= 10) {
    clearInterval(timerInterval);
    document.getElementById('finish-screen').style.display = 'flex';
    return;
  }

  currentItem = words[Math.floor(Math.random() * words.length)];
  document.getElementById('q-img').textContent = currentItem.i;
  speak(currentItem.w);

  const opts = [currentItem.w];
  while(opts.length < 4) {
    const r = words[Math.floor(Math.random() * words.length)].w;
    if(!opts.includes(r)) opts.push(r);
  }
  opts.sort(() => Math.random() - 0.5);

  const grid = document.getElementById('opt-grid');
  grid.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = o;
    btn.onclick = () => check(o);
    grid.appendChild(btn);
  });

  resetTimer();
}

function check(ans) {
  if (ans === currentItem.w) {
    score++;
    playSound('success');
    document.getElementById('score').textContent = score;
    speak(ans);
    nextRound();
  } else {
    playSound('error');
    speak("No");
    timerWidth -= 20; // Penalty
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerWidth = 100;
  timerInterval = setInterval(() => {
    timerWidth -= 1.5;
    document.getElementById('timer-fill').style.width = timerWidth + '%';
    if (timerWidth <= 0) {
      nextRound();
    }
  }, 100);
}

function finishGame() {
  const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  progress['game6'] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  window.location.href = 'index.html';
}

init();
</script>
</body>
</html>
