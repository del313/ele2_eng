<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼兒英文樂園 – Grade K</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  .pair-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr; /* 左邊 Unit 稍微寬一點點，右邊 Game */
    gap: 16px;
    margin-bottom: 20px;
  }

  /* 覆蓋樣式使其在並排時更美觀 */
  .unit-card, .game-card {
    margin: 0 !important;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 10px !important;
  }

  .game-card {
    grid-column: auto !important;
    text-align: center !important;
  }
  
  .game-card .content { text-align: center !important; }
  .game-card .card-title { font-size: 1.1rem !important; }
  .game-card .card-icon { margin-bottom: 8px; }

  @media (max-width: 600px) {
    .pair-grid {
      gap: 10px;
    }
    .unit-card .card-icon, .game-card .card-icon {
      font-size: 2.5rem !important;
    }
    .unit-card .card-title, .game-card .card-title {
      font-size: 1rem !important;
    }
  }
</style>
</head>
<body>

<header>
  <h1>🐣 幼兒英文樂園</h1>
  <p>Kindergarten English · 8 Units + 8 Games</p>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 16 完成</div>
  <div class="header-btns">
    <button class="reset-progress-btn" onclick="resetProgress()">🔄 重設進度</button>
    <a href="../index.html" class="back-home-btn">🏠 回首頁</a>
  </div>
</header>

<style>
  /* TODO: 調整「回首頁」與「重設進度」按鈕大小一致 */
  .header-btns {
    display: flex;
    justify-content: space-between;
    margin: 15px auto 0 auto;
    max-width: 800px;
    padding: 0 20px;
    gap: 20px;
  }
  .back-home-btn, .reset-progress-btn {
    box-sizing: border-box;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    color: white;
    font-size: 13px;
    font-weight: 800;
    padding: 0;
    height: 40px;
    width: 130px;
    text-decoration: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    margin: 0 !important;
  }
  .back-home-btn:hover, .reset-progress-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
  }
</style>

<div class="container">

  <div class="continue-banner hidden" id="continueBanner">
    <div class="cb-text" style="font-size: 1.1rem;">繼續挑戰：<span id="continueTitle" style="color:#F06292"></span></div>
    <a href="#" class="cb-btn" id="continueLink" style="background:#F06292; color:white; padding:10px 20px; border-radius:30px; text-decoration:none; font-weight:800; margin-left:15px;">GO! →</a>
  </div>

  <div class="section-label" id="p1">第一階段：探索世界 (Unit 1-4)</div>
  <div class="pair-grid" id="pairs1"></div>

  <div class="section-label" id="p2" style="margin-top:40px;">第二階段：日常點滴 (Unit 5-8)</div>
  <div class="pair-grid" id="pairs2"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FFF;border:3px solid #4FC3F7"></div> 準備好</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FFFDE7;border:3px solid #FFB74D"></div> 進行中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F1F8E9;border:3px solid #81C784"></div> 已完成</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ECEFF1;border:3px solid #D1D9E0"></div> 鎖定中</div>
  </div>

</div>

<script src="kinder.js"></script>
<script>
(function() {
  const units = unitsMeta.map(u => ({
    ...u,
    sub: '學單字 + 跟讀 + 小測驗',
    file: u.id + '.html'
  }));

  const games = gamesMeta.map((g, idx) => ({
    ...g,
    sub: '解鎖自 Unit ' + (idx + 1),
    file: g.id + '.html',
    phase: idx < 4 ? 1 : 2,
    unlockUnit: 'unit' + (idx + 1)
  }));

  const unitSequence = units.map(u => u.id);
  const progress = loadProgress();

  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

  window.resetProgress = function() {
    if (confirm('確定要清除所有進度嗎？')) {
      localStorage.removeItem(PROGRESS_KEY);
      location.reload();
    }
  };

  function getState(id) {
    if (progress[id] === 'done') return 'done';
    if (progress[id] === 'in_progress') return 'in-progress';
    
    if (id.startsWith('unit')) {
      const idx = unitSequence.indexOf(id);
      if (idx === 0) return 'available';
      const prev = unitSequence[idx - 1];
      if (progress[prev] === 'done') return 'available';
      return 'locked';
    } else if (id.startsWith('game')) {
      const game = games.find(g => g.id === id);
      return progress[game.unlockUnit] === 'done' ? 'available' : 'locked';
    }
    return 'locked';
  }

  function makeUnitCard(u, num) {
    const state = getState(u.id);
    const a = document.createElement('a');
    a.className = `unit-card ${state}`;
    a.href = state === 'locked' ? '#' : u.file;
    if (state === 'locked') a.onclick = e => e.preventDefault();
    
    const badge = state === 'done' ? '⭐' : state === 'in-progress' ? '▶️' : state === 'locked' ? '🔒' : '';
    a.innerHTML = `
      ${badge ? `<div class="card-badge">${badge}</div>` : ''}
      <div class="card-num">UNIT ${num}</div>
      <div class="card-icon">${u.icon}</div>
      <div class="card-title">${u.title}</div>
      <div class="card-sub">${u.sub}</div>`;
    return a;
  }

  function makeGameCard(game) {
    const state = getState(game.id);
    const a = document.createElement('a');
    a.className = `game-card ${state}`;
    a.href = state === 'locked' ? '#' : game.file;
    if (state === 'locked') a.onclick = e => e.preventDefault();
    
    const badge = state === 'done' ? ' 🏆' : state === 'locked' ? ' 🔒' : ' 🎁';
    a.innerHTML = `
      <div class="card-icon">${game.icon}</div>
      <div class="content">
        <div class="card-title">${game.title}${badge}</div>
        <div class="card-sub">${game.sub}</div>
      </div>`;
    return a;
  }

  // 渲染卡片 (左右配對)
  const renderPair = (idx, targetId) => {
    const area = document.getElementById(targetId);
    if (!area) return;
    area.appendChild(makeUnitCard(units[idx], idx + 1));
    area.appendChild(makeGameCard(games[idx]));
  };

  [0, 1, 2, 3].forEach(i => renderPair(i, 'pairs1'));
  [4, 5, 6, 7].forEach(i => renderPair(i, 'pairs2'));

  // 進度條
  const sequence = [...unitSequence, ...games.map(g => g.id)];
  const total = sequence.length;
  const done = sequence.filter(id => progress[id] === 'done').length;
  document.getElementById('progressBar').style.width = `${Math.round(done/total*100)}%`;
  document.getElementById('progressLabel').textContent = `${done} / ${total} 完成`;

  // 繼續挑戰
  const targetUnit = unitSequence.find(id => progress[id] !== 'done');
  const target = targetUnit || games.map(g => g.id).find(id => progress[id] !== 'done');
  if (target) {
    const state = getState(target);
    if (state !== 'locked') {
      const banner = document.getElementById('continueBanner');
      banner.classList.remove('hidden');
      banner.style.display = 'flex';
      const u = units.find(x => x.id === target) || games.find(x => x.id === target);
      if (u) {
        document.getElementById('continueTitle').textContent = u.title;
        document.getElementById('continueLink').href = u.file;
      }
    }
  }
})();

// 錨點自動滾動邏輯
window.addEventListener('load', () => {
  if (window.location.hash) {
    const targetId = window.location.hash.substring(1);
    const el = document.getElementById(targetId);
    if (el) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 500);
    }
  }
});
</script>
</body>
</html>
