<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指令大挑戰 - Action Challenge</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E1F5FE; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .action-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px;
  }

  .action-btn {
    background: white; border-radius: 20px; padding: 20px 10px;
    border: 4px solid var(--blue); cursor: pointer;
    transition: all 0.2s; box-shadow: 0 6px 0 var(--blue);
  }
  .action-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue); }
  .action-btn.active { background: var(--yellow); transform: scale(1.1); z-index: 5; }
  .action-btn .icon { font-size: 3rem; margin-bottom: 5px; }
  .action-btn .word { font-size: 1.1rem; font-weight: 800; color: var(--text); }

  .sequence-indicator {
    margin: 20px 0; font-size: 1.2rem; font-weight: 900; color: var(--pink);
    min-height: 1.5rem;
  }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
  
  .level-badge {
    display: inline-block; background: var(--pink); color: white;
    padding: 5px 20px; border-radius: 20px; font-weight: 800; margin-bottom: 10px;
  }
</style>
</head>
<body>

<header style="padding:15px; text-align:center; background:var(--blue); color:white;">
  <a href="index.html#p2" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 返回</a>
  <h1>🎬 指令大挑戰</h1>
</header>

<div class="game-container">
  <div class="level-badge">關卡: <span id="level">1</span> / 5</div>
  <div class="sequence-indicator" id="status">聽聽看，老師說了什麼？</div>
  
  <div class="action-grid" id="grid"></div>
  
  <button id="start-btn" onclick="playSequence()" style="margin-top:30px; padding:15px 40px; border-radius:30px; border:none; background:var(--green); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; box-shadow:0 8px 0 #66BB6A;">
    開始播放指令 ▶️
  </button>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">👑</div>
  <h2 style="font-size:2.5rem; color:var(--blue);">全能挑戰王！</h2>
  <p style="font-size:1.2rem;">你完成了所有的動作指令！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:40px; border:none; background:var(--blue); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; margin-top:30px; box-shadow:0 8px 0 #1976D2;">
    領取終極獎牌 🏆
  </button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit8';
const GAME_ID = 'game8';

let vocab = [];
let sequence = [];
let userSequence = [];
let level = 1;
let isPlaying = false;

function init() {
  vocab = unitDataMap[UNIT_ID].vocab;
  const grid = document.getElementById('grid');
  
  vocab.forEach(item => {
    const btn = document.createElement('div');
    btn.className = 'action-btn';
    btn.id = 'btn-' + item.word;
    btn.innerHTML = `
      <div class="icon">${item.icon}</div>
      <div class="word">${item.word}</div>
    `;
    btn.onclick = () => handleUserInput(item.word);
    grid.appendChild(btn);
  });
}

async function playSequence() {
  if (isPlaying) return;
  isPlaying = true;
  document.getElementById('start-btn').disabled = true;
  document.getElementById('status').textContent = "仔細聽...";
  userSequence = [];
  
  // 建立隨機指令序列
  sequence = [];
  for (let i = 0; i < level; i++) {
    sequence.push(vocab[Math.floor(Math.random() * vocab.length)].word);
  }

  // 逐一播放
  for (const word of sequence) {
    await highlightButton(word);
    await new Promise(r => setTimeout(r, 300));
  }

  document.getElementById('status').textContent = "換你了！請按順序點擊。";
  isPlaying = false;
}

function highlightButton(word) {
  return new Promise(resolve => {
    const btn = document.getElementById('btn-' + word);
    btn.classList.add('active');
    speakText(word);
    setTimeout(() => {
      btn.classList.remove('active');
      resolve();
    }, 800);
  });
}

function handleUserInput(word) {
  if (isPlaying || sequence.length === 0) return;
  
  userSequence.push(word);
  const expected = sequence[userSequence.length - 1];
  
  if (word === expected) {
    playSound('success');
    speakText(word);
    if (userSequence.length === sequence.length) {
      // 過關
      if (level >= 5) {
        setTimeout(win, 500);
      } else {
        level++;
        document.getElementById('level').textContent = level;
        document.getElementById('status').textContent = "答對了！準備下一關。";
        document.getElementById('start-btn').disabled = false;
        sequence = [];
      }
    }
  } else {
    // 答錯
    playSound('error');
    speakText("Oh no, try again!");
    document.getElementById('status').textContent = "記錯了，再聽一次吧！";
    userSequence = [];
    document.getElementById('start-btn').disabled = false;
  }
}

function win() {
  document.getElementById('finish-screen').style.display = 'flex';
  speakText("You are the action master! Congratulations!");
}

function finishGame() {
  setProgress(GAME_ID, 'done');
  location.href = "index.html#p2";
}

init();
</script>
</body>
</html>
