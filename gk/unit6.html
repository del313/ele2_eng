<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 6 – Letters U-X</title>
<script src="../js-common.js"></script>
<script src="kinder.js"></script>
<link rel="stylesheet" href="../style-unit.css">
<style>
  .page-center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .page { display: none; }
  .page.active { display: block; }
  .page.page-center.active { display: flex; }
</style>
</head>
<body>

<header style="position:relative">
  <a href="index.html#p2" class="home-btn btn-hover">🏠 首頁</a>
  <div class="unit-label btn-hover">UNIT 6 OF 8 &nbsp;·&nbsp; GRADE K</div>
  <h1>☂️ Letters U-X</h1>
</header>

<div class="step-nav btn-hover" id="stepNav"></div>

<div class="page active btn-hover" id="page-0">
  <div class="page-title btn-hover"><span>🎵</span> 暖身</div>
  <div class="video-btn-wrap btn-hover">
    <a class="video-btn btn-hover" href="https://www.youtube.com/watch?v=hq3yfQnllfQ" target="_blank" rel="noopener">
      <span class="yt-icon btn-hover">▶️</span> 開啟 Usher ABC Song 影片
    </a>
  </div>
</div>

<div class="page btn-hover" id="page-1">
  <div class="page-title btn-hover"><span>🃏</span> 認識字母</div>
  <div class="vocab-grid btn-hover" id="letterGrid"></div>
</div>

<div class="page page-center btn-hover" id="page-2">
  <div class="page-title btn-hover"><span>🎉</span> 完成！</div>
  <button class="complete-btn btn-hover" id="completeBtn" onclick="markDone()">✅ 完成本課！</button>
  <div class="complete-done btn-hover" id="completeDone" style="text-align: center; display: none;">
    <h3>恭喜完成 Unit 6！</h3>
    <p>下一課：Unit 7：Letters Y-Z</p>
    <a href="index.html#p2" class="home-btn btn-hover" style="position:static; margin-top:15px; background:var(--orange)">🏠 返回課程列表</a>
  </div>
</div>

<script>
const UNIT_KEY = 'unit6';
const items = [{"letter": "U", "word": "Umbrella", "icon": "☂️"}, {"letter": "V", "word": "Van", "icon": "🚐"}, {"letter": "W", "word": "Whale", "icon": "🐋"}, {"letter": "X", "word": "Xylophone", "icon": "🎹"}];

const steps = [{label:'暖身', icon:'🎵'}, {label:'字母', icon:'🃏'}, {label:'完成', icon:'🎉'}];
const stepNav = document.getElementById('stepNav');
steps.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'step-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="si btn-hover">${s.icon}</span>${s.label}`;
  btn.onclick = () => goTo(i);
  btn.id = `step-${i}`;
  stepNav.appendChild(btn);
});

const grid = document.getElementById('letterGrid');
items.forEach(item => {
  const card = document.createElement('div');
  card.className = 'vocab-card';
  card.innerHTML = `
    <div class="en btn-hover" style="font-size:2em">${item.letter}</div>
    <div style="font-size:3em">${item.icon}</div>
    <div class="en btn-hover">${item.word}</div>
    <button class="speak-btn btn-hover" onclick="speak('${item.letter} is for ${item.word}')">🔊</button>
  `;
  grid.appendChild(card);
});

let currentPage = 0;
const pages = document.querySelectorAll('.page');
function goTo(i) {
  pages[currentPage].classList.remove('active');
  document.getElementById(`step-${currentPage}`).classList.remove('active');
  currentPage = Math.max(0, Math.min(pages.length - 1, i));
  pages[currentPage].classList.add('active');
  document.getElementById(`step-${currentPage}`).classList.add('active');
  window.scrollTo(0,0);
}

function markDone() {
  const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  p[UNIT_KEY] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  document.getElementById('completeBtn').style.display = 'none';
  document.getElementById('completeDone').style.display = 'block';
}
</script>
</body>
</html>
