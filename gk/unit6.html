<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 6 - Food</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { display: flex; flex-direction: column; background: #fff; }
  .unit-header {
    background: linear-gradient(135deg, var(--blue), var(--green));
    color: white; padding: 20px; text-align: center; position: relative;
  }
  .home-btn {
    position: absolute; top: 15px; left: 15px;
    background: rgba(255,255,255,0.3); border: none; padding: 8px 15px;
    border-radius: 20px; color: white; text-decoration: none; font-weight: 800;
  }

  .step-nav { display: flex; background: #F8F9FA; border-bottom: 2px solid #EEE; }
  .step-btn {
    flex: 1; padding: 12px; border: none; background: none; cursor: pointer;
    font-size: 14px; font-weight: 800; color: var(--muted);
    transition: all 0.2s; border-bottom: 4px solid transparent;
  }
  .step-btn.active { color: var(--blue); border-bottom-color: var(--blue); background: #E1F5FE; }

  .page { display: none; padding: 25px 20px 100px; max-width: 600px; margin: 0 auto; width: 100%; animation: fadeIn 0.4s; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .page-title { font-size: 1.8rem; font-weight: 900; color: var(--blue); margin-bottom: 20px; text-align: center; }

  .hotspot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
  .hotspot-card {
    background: #FFF8E1; border-radius: 20px; padding: 20px; text-align: center;
    border: 3px dashed #FFB74D; cursor: pointer; transition: 0.2s;
  }
  .hotspot-card .icon { font-size: 4rem; }

  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .vocab-card {
    background: #F0F9FF; border-radius: 20px; padding: 20px; text-align: center;
    border: 3px solid var(--blue); cursor: pointer; transition: 0.2s;
  }
  .vocab-card:hover { transform: scale(1.05); }
  .vocab-card .icon { font-size: 4rem; display: block; }
  .vocab-card .word { font-size: 1.5rem; font-weight: 900; color: var(--text); margin-top: 10px; }

  .quiz-img { font-size: 6rem; text-align: center; margin-bottom: 20px; }
  .quiz-options { display: grid; gap: 10px; }
  .opt-btn {
    padding: 15px; border-radius: 15px; border: 3px solid #DDD;
    background: white; font-size: 1.2rem; font-weight: 800; cursor: pointer;
  }
  .opt-btn.correct { background: var(--green); color: white; border-color: #2E7D32; }
  .opt-btn.wrong { background: var(--pink); color: white; border-color: #C2185B; animation: shake 0.3s; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 15px; background: white; border-top: 2px solid #EEE;
    display: flex; justify-content: space-between; gap: 10px;
    z-index: 100;
  }
  .nav-btn {
    flex: 1; padding: 15px; border-radius: 15px; border: none;
    font-size: 1.1rem; font-weight: 900; cursor: pointer;
  }
  .btn-next { background: var(--blue); color: white; }
  .btn-prev { background: #EEE; color: var(--muted); }

  .finish-icon { font-size: 8rem; animation: star-pop 0.6s infinite alternate; text-align: center; }
  @keyframes star-pop { from { transform: scale(1); } to { transform: scale(1.2); } }
</style>
</head>
<body onload="init()">

<header class="unit-header">
  <a href="index.html" class="home-btn">🏠 首頁</a>
  <h1 id="headerTitle">Unit 6</h1>
  <p id="headerSub">Food</p>
</header>

<nav class="step-nav">
  <button class="step-btn active" onclick="showPage(0)">1. 暖身</button>
  <button class="step-btn" onclick="showPage(1)">2. 單字</button>
  <button class="step-btn" onclick="showPage(2)">3. 測驗</button>
  <button class="step-btn" onclick="showPage(3)">4. 跟讀</button>
  <button class="step-btn" onclick="showPage(4)">5. 完成</button>
</nav>

<div class="page active" id="page0">
  <h2 class="page-title">聽聽看，點點看</h2>
  <div class="hotspot-grid" id="hotspotGrid"></div>
  <div style="background:#FFF9C4; padding:20px; border-radius:20px; border:2px dashed #FBC02D; margin-top:20px; text-align:center;">
    <strong>任務：</strong> 點擊圖案聽聽看英文怎麼說！
  </div>
</div>

<div class="page" id="page1">
  <h2 class="page-title">跟我一起讀</h2>
  <div class="vocab-grid" id="vocabGrid"></div>
</div>

<div class="page" id="page2">
  <h2 class="page-title">挑戰一下</h2>
  <div id="quiz-container"></div>
</div>

<div class="page" id="page3">
  <h2 class="page-title">大聲說出來</h2>
  <div id="speak-container"></div>
</div>

<div class="page" id="page4">
  <h2 class="page-title">太棒了！</h2>
  <div class="finish-icon" id="sticker">⭐</div>
  <div style="text-align:center; margin-top:30px;">
    <p style="font-size:1.3rem; font-weight:800;" id="finishText">恭喜完成本單元！</p>
    <button onclick="finishUnit()" style="margin-top:20px; width:100%; padding:20px; border-radius:20px; border:none; background:var(--green); color:white; font-size:1.5rem; font-weight:900; cursor:pointer;">
      ✅ 結束並領取獎勵
    </button>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn btn-prev" id="prevBtn" onclick="prevPage()">上一步</button>
  <button class="nav-btn btn-next" id="nextBtn" onclick="nextPage()">下一步</button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit6';
const unitData = unitDataMap[UNIT_ID];
let currentPage = 0;
const totalPages = 5;

let currentQuizIndex = 0;
let quizQuestions = [];
let currentSpeakIndex = 0;

function init() {
  const progress = loadProgress();
  if (progress[UNIT_ID] !== 'done') {
    setProgress(UNIT_ID, 'in_progress');
  }
  
  const hotspotGrid = document.getElementById('hotspotGrid');
  unitData.vocab.slice(0, 3).forEach(item => {
    const card = document.createElement('div');
    card.className = 'hotspot-card';
    card.onclick = () => speakText(item.word);
    card.innerHTML = `<div class="icon">${item.icon}</div>`;
    hotspotGrid.appendChild(card);
  });

  const vocabGrid = document.getElementById('vocabGrid');
  unitData.vocab.forEach(item => {
    const card = document.createElement('div');
    card.className = 'vocab-card';
    card.onclick = () => speakText(item.word);
    card.innerHTML = `<span class="icon">${item.icon}</span><span class="word">${item.word}</span>`;
    vocabGrid.appendChild(card);
  });

  quizQuestions = [...unitData.vocab].sort(() => 0.5 - Math.random()).slice(0, 3);
  updateNav();
}

function showPage(idx) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('page' + idx).classList.add('active');
  document.querySelectorAll('.step-btn')[idx].classList.add('active');
  currentPage = idx;

  if (idx === 2) {
    currentQuizIndex = 0;
    renderQuiz();
  }
  if (idx === 3) {
    currentSpeakIndex = 0;
    renderSpeak();
  }
  if (idx === 4) {
    const stickers = ['🌟', '🦄', '🎈', '🚀', '🍭'];
    document.getElementById('sticker').textContent = stickers[Math.floor(Math.random() * stickers.length)];
  }

  updateNav();
  window.scrollTo(0,0);
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  const q = quizQuestions[currentQuizIndex];
  const others = unitData.vocab.filter(v => v.word !== q.word).sort(() => 0.5 - Math.random()).slice(0, 2);
  const options = [...others, q].sort(() => 0.5 - Math.random());

  container.innerHTML = `
    <div style="text-align:right; font-weight:bold; color:var(--muted); margin-bottom:10px;">
      題次: ${currentQuizIndex + 1} / ${quizQuestions.length}
    </div>
    <div class="quiz-img">${q.icon}</div>
    <div class="quiz-options">
      ${options.map(opt => `
        <button class="opt-btn" onclick="checkAnswer(this, ${opt.word === q.word})">${opt.word}</button>
      `).join('')}
    </div>
  `;
}

function renderSpeak() {
  const container = document.getElementById('speak-container');
  const s = unitData.speakLines[currentSpeakIndex];
  
  container.innerHTML = `
    <div style="text-align:right; font-weight:bold; color:var(--muted); margin-bottom:10px;">
      練習: ${currentSpeakIndex + 1} / ${unitData.speakLines.length}
    </div>
    <div style="text-align:center; padding:20px;">
      <div style="font-size:4rem; margin-bottom:20px;">🗣️</div>
      <p style="font-size:1.8rem; font-weight:900; color:var(--blue); margin-bottom:30px;">${s}</p>
      <button onclick="speakText('${s}')" style="padding:15px 40px; border-radius:30px; border:none; background:var(--orange); color:white; font-size:1.3rem; font-weight:800; cursor:pointer; box-shadow: 0 4px 10px rgba(255,152,0,0.3);">
        🔊 聽聽看並跟讀
      </button>
      ${currentSpeakIndex < unitData.speakLines.length - 1 
        ? `<button onclick="nextSpeak()" style="display:block; margin: 30px auto 0; background:none; border:none; color:var(--blue); font-weight:800; cursor:pointer; font-size:1.1rem;">下一個句型 ➔</button>`
        : `<p style="margin-top:30px; color:var(--green); font-weight:800;">✨ 太棒了！準備好領獎勵了嗎？</p>`
      }
    </div>
  `;
}

function nextSpeak() {
  if (currentSpeakIndex < unitData.speakLines.length - 1) {
    currentSpeakIndex++;
    renderSpeak();
  }
}

function checkAnswer(btn, isCorrect) {
  if (isCorrect) {
    btn.classList.add('correct');
    speakText('Correct! Good job!');
    setTimeout(() => {
      if (currentQuizIndex < quizQuestions.length - 1) {
        currentQuizIndex++;
        renderQuiz();
      } else {
        nextPage();
      }
    }, 1000);
  } else {
    btn.classList.add('wrong');
    speakText('Try again!');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

function nextPage() { if (currentPage < totalPages - 1) showPage(currentPage + 1); }
function prevPage() { if (currentPage > 0) showPage(currentPage - 1); }

function updateNav() {
  document.getElementById('prevBtn').style.visibility = currentPage === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').style.display = currentPage === totalPages - 1 ? 'none' : 'block';
}

function finishUnit() {
  setProgress(UNIT_ID, 'done');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
