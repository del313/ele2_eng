<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字母接接樂 - Letter Catcher</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E1F5FE; overflow: hidden; touch-action: none; }
  #game-area { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  
  .basket {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 60px; background: #795548; border-radius: 0 0 40px 40px;
    display: flex; align-items: center; justify-content: center; font-size: 2rem;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 4px solid #5D4037;
    z-index: 10;
  }
  .basket::before {
    content: ''; position: absolute; top: -15px; width: 110px; height: 15px;
    background: #8D6E63; border-radius: 10px;
  }

  .letter {
    position: absolute; font-size: 2.5rem; font-weight: 900; color: #1565C0;
    text-shadow: 2px 2px 0 white; cursor: default;
  }

  .ui {
    position: relative; z-index: 20; padding: 20px; text-align: center; pointer-events: none;
  }
  .target-word-display {
    font-size: 2.5rem; font-weight: 900; letter-spacing: 5px; color: var(--text);
    background: rgba(255,255,255,0.8); padding: 5px 20px; border-radius: 30px;
    display: inline-block;
  }
  .target-word-display span { color: #ccc; }
  .target-word-display span.filled { color: var(--pink); }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:15px; text-align:center; background:var(--blue); color:white; position:relative; z-index:30;">
  <a href="index.html" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 返回</a>
  <h1>🧺 字母接接樂</h1>
</header>

<div class="ui">
  <div class="target-word-display" id="target-display"></div>
  <div style="margin-top:10px; font-weight:800;">接住對應的字母！</div>
</div>

<div id="game-area">
  <div class="basket" id="basket">🧺</div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🍎</div>
  <h2 style="font-size:2.5rem; color:var(--blue);">接得好！</h2>
  <p style="font-size:1.2rem;">你學會了拼寫這些單字！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:40px; border:none; background:var(--blue); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; margin-top:30px; box-shadow:0 8px 0 #1976D2;">
    領取獎牌 🏅
  </button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit6';
const GAME_ID = 'game6';

let vocab = [];
let targetIndex = 0;
let currentWord = '';
let currentLetters = [];
let letterIndex = 0;
let basketX = window.innerWidth / 2;
let gameActive = true;

function init() {
  vocab = shuffle(unitDataMap[UNIT_ID].vocab).slice(0, 4);
  nextWord();
  
  // 監聽觸控/滑鼠移動籃子
  document.addEventListener('mousemove', e => moveBasket(e.clientX));
  document.addEventListener('touchmove', e => {
    e.preventDefault();
    moveBasket(e.touches[0].clientX);
  }, { passive: false });

  // 開始掉落字母
  setInterval(spawnLetter, 1000);
}

function nextWord() {
  if (targetIndex >= vocab.length) {
    win();
    return;
  }
  currentWord = vocab[targetIndex].word.toUpperCase();
  currentLetters = currentWord.split('');
  letterIndex = 0;
  updateDisplay();
  speakText("Catch the letters for " + currentWord);
}

function updateDisplay() {
  const display = document.getElementById('target-display');
  display.innerHTML = currentLetters.map((l, i) => 
    `<span class="${i < letterIndex ? 'filled' : ''}">${l}</span>`
  ).join('');
}

function moveBasket(x) {
  if (!gameActive) return;
  basketX = Math.max(50, Math.min(window.innerWidth - 50, x));
  document.getElementById('basket').style.left = basketX + 'px';
}

function spawnLetter() {
  if (!gameActive) return;

  const area = document.getElementById('game-area');
  const letterEl = document.createElement('div');
  letterEl.className = 'letter';
  
  // 決定掉落哪個字母 (目標字母或隨機字母)
  const isTarget = Math.random() > 0.4;
  const char = isTarget ? currentLetters[letterIndex] : String.fromCharCode(65 + Math.floor(Math.random() * 26));
  
  letterEl.textContent = char;
  const startX = 30 + Math.random() * (window.innerWidth - 60);
  letterEl.style.left = startX + 'px';
  letterEl.style.top = '-50px';
  area.appendChild(letterEl);

  let posY = -50;
  const speed = 2 + Math.random() * 3;

  function move() {
    if (!gameActive || !letterEl.parentElement) return;
    posY += speed;
    letterEl.style.top = posY + 'px';

    // 碰撞檢查
    const basketRect = document.getElementById('basket').getBoundingClientRect();
    const letterRect = letterEl.getBoundingClientRect();

    if (
      letterRect.bottom >= basketRect.top &&
      letterRect.left < basketRect.right &&
      letterRect.right > basketRect.left &&
      letterRect.top < basketRect.bottom
    ) {
      checkLetter(char);
      letterEl.remove();
      return;
    }

    if (posY > window.innerHeight) {
      letterEl.remove();
    } else {
      requestAnimationFrame(move);
    }
  }
  requestAnimationFrame(move);
}

function checkLetter(char) {
  if (char === currentLetters[letterIndex]) {
    playSound('success');
    letterIndex++;
    speakText(char);
    updateDisplay();
    if (letterIndex >= currentLetters.length) {
      speakText(currentWord);
      targetIndex++;
      setTimeout(nextWord, 1000);
    }
  } else {
    playSound('error');
    // 震動籃子
    const b = document.getElementById('basket');
    b.style.transform = 'translateX(-50%) rotate(10deg)';
    setTimeout(() => b.style.transform = 'translateX(-50%) rotate(-10deg)', 100);
    setTimeout(() => b.style.transform = 'translateX(-50%) rotate(0)', 200);
  }
}

function win() {
  gameActive = false;
  document.getElementById('finish-screen').style.display = 'flex';
  speakText("You are a spelling star!");
}

function finishGame() {
  setProgress(GAME_ID, 'done');
  location.href = 'index.html';
}

init();
</script>
</body>
</html>
