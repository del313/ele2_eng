<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影子拼圖 - Silhouette Fill</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #FFF9C4; touch-action: none; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .game-board {
    display: flex; justify-content: space-around; align-items: stretch;
    margin-top: 20px; gap: 15px;
  }

  .source-area, .target-area {
    background: rgba(255,255,255,0.5); padding: 15px; border-radius: 25px;
    width: 48%; display: flex; flex-direction: column; gap: 10px;
    border: 3px dashed var(--orange);
  }

  .draggable {
    background: white; border-radius: 15px; font-size: 2.5rem;
    cursor: grab; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    user-select: none; transition: transform 0.2s;
    touch-action: none;
    height: 80px; display: flex; align-items: center; justify-content: center;
  }
  .draggable:active { cursor: grabbing; transform: scale(1.1); }

  .dropzone {
    height: 80px; border-radius: 15px; background: rgba(0,0,0,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; filter: grayscale(1) brightness(0.5);
    transition: all 0.3s; position: relative;
  }
  .dropzone.filled { filter: none; background: #C8E6C9; border: 3px solid var(--green); }
  .dropzone.hover { background: rgba(0,0,0,0.2); transform: scale(1.05); }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:15px; text-align:center; background:var(--orange); color:white;">
  <a href="index.html#p1" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 返回</a>
  <h1>🧩 影子拼圖</h1>
</header>

<div class="game-container btn-hover">
  <div style="font-weight:800; color:var(--text);">將圖片拖到正確的影子裡！ (6 組)</div>
  
  <div class="game-board btn-hover">
    <div class="source-area btn-hover" id="source-area"></div>
    <div class="target-area btn-hover" id="target-area"></div>
  </div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🌟</div>
  <h2 style="font-size:2.5rem; color:var(--orange);">拼好了！</h2>
  <p style="font-size:1.2rem;">你對形狀非常了解！</p>
  <button onclick="finishGame()" class="game-btn btn-hover">
    領取獎牌 🏆
  </button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit4';
const GAME_ID = 'game4';

let vocab = [];
let matches = 0;
let draggedElement = null;

function init() {
  // 修改為 6 組
  vocab = shuffle(unitDataMap[UNIT_ID].vocab).slice(0, 6);
  const sourceArea = document.getElementById('source-area');
  const targetArea = document.getElementById('target-area');

  // 渲染彩色圖片（左側）
  const sourceItems = shuffle(vocab);
  sourceItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'draggable';
    div.draggable = true;
    div.textContent = item.icon;
    div.dataset.word = item.word;
    
    // 觸控支援
    div.ontouchstart = e => { draggedElement = div; };
    div.ondragstart = e => { draggedElement = div; };
    
    sourceArea.appendChild(div);
  });

  // 渲染影子（右側）
  vocab.forEach(item => {
    const div = document.createElement('div');
    div.className = 'dropzone';
    div.dataset.word = item.word;
    div.textContent = item.icon;
    
    div.ondragover = e => e.preventDefault();
    div.ondrop = e => handleDrop(div);
    
    targetArea.appendChild(div);
  });
}

function handleDrop(targetZone) {
  if (!draggedElement) return;
  
  if (draggedElement.dataset.word === targetZone.dataset.word) {
    playSound('success');
    targetZone.classList.add('filled');
    draggedElement.style.visibility = 'hidden';
    speakText(targetZone.dataset.word);
    matches++;
    draggedElement = null;
    if (matches === 6) win();
  } else {
    playSound('error');
    speakText("Try another one!");
    draggedElement = null;
  }
}

// 觸控模擬拖曳
document.addEventListener('touchend', e => {
  if (!draggedElement) return;
  const touch = e.changedTouches[0];
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  const zone = target ? target.closest('.dropzone') : null;
  if (zone) handleDrop(zone);
  draggedElement = null;
});

function win() {
  setTimeout(() => {
    document.getElementById('finish-screen').style.display = 'flex';
    speakText("You did it! Amazing!");
  }, 500);
}

function finishGame() {
  setProgress(GAME_ID, 'done');
  location.href = "index.html#p1";
}

init();
</script>
</body>
</html>
