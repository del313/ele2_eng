<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5 – Letters Q-T</title>
<script src="../js-common.js"></script>
<script src="kinder.js"></script>
<link rel="stylesheet" href="../style-unit.css">
<style>
  .page-center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .page { display: none; }
  .page.active { display: block; }
  .page.page-center.active { display: flex; }
</style>
</head>
<body>

<header style="position:relative">
  <a href="index.html#p2" class="home-btn">🏠 首頁</a>
  <div class="unit-label">UNIT 5 OF 8 &nbsp;·&nbsp; GRADE K</div>
  <h1>👸 Letters Q-T</h1>
</header>

<div class="step-nav" id="stepNav"></div>

<div class="page active" id="page-0">
  <div class="page-title"><span>🎵</span> 暖身</div>
  <div class="video-btn-wrap">
    <a class="video-btn" href="https://www.youtube.com/watch?v=XqZsoesa55w" target="_blank" rel="noopener">
      <span class="yt-icon">▶️</span> 開啟 Baby Shark 影片
    </a>
  </div>
</div>

<div class="page" id="page-1">
  <div class="page-title"><span>🃏</span> 認識字母</div>
  <div class="vocab-grid" id="letterGrid"></div>
</div>

<div class="page page-center" id="page-2">
  <div class="page-title"><span>🎉</span> 完成！</div>
  <button class="complete-btn" id="completeBtn" onclick="markDone()">✅ 完成本課！</button>
  <div class="complete-done" id="completeDone" style="text-align: center; display: none;">
    <h3>恭喜完成 Unit 5！</h3>
    <p>下一課：Unit 6：Letters U-X</p>
    <a href="index.html#p2" class="home-btn" style="position:static; margin-top:15px; background:var(--orange)">🏠 返回課程列表</a>
  </div>
</div>

<script>
const UNIT_KEY = 'unit5';
const items = [{"letter": "Q", "word": "Queen", "icon": "👸"}, {"letter": "R", "word": "Rabbit", "icon": "🐰"}, {"letter": "S", "word": "Sun", "icon": "☀️"}, {"letter": "T", "word": "Tiger", "icon": "🐯"}];

const steps = [{label:'暖身', icon:'🎵'}, {label:'字母', icon:'🃏'}, {label:'完成', icon:'🎉'}];
const stepNav = document.getElementById('stepNav');
steps.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'step-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="si">${s.icon}</span>${s.label}`;
  btn.onclick = () => goTo(i);
  btn.id = `step-${i}`;
  stepNav.appendChild(btn);
});

const grid = document.getElementById('letterGrid');
items.forEach(item => {
  const card = document.createElement('div');
  card.className = 'vocab-card';
  card.innerHTML = `
    <div class="en" style="font-size:2em">${item.letter}</div>
    <div style="font-size:3em">${item.icon}</div>
    <div class="en">${item.word}</div>
    <button class="speak-btn" onclick="speak('${item.letter} is for ${item.word}')">🔊</button>
  `;
  grid.appendChild(card);
});

let currentPage = 0;
const pages = document.querySelectorAll('.page');
function goTo(i) {
  pages[currentPage].classList.remove('active');
  document.getElementById(`step-${currentPage}`).classList.remove('active');
  currentPage = Math.max(0, Math.min(pages.length - 1, i));
  pages[currentPage].classList.add('active');
  document.getElementById(`step-${currentPage}`).classList.add('active');
  window.scrollTo(0,0);
}

function markDone() {
  const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  p[UNIT_KEY] = 'done';
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  document.getElementById('completeBtn').style.display = 'none';
  document.getElementById('completeDone').style.display = 'block';
}
</script>
</body>
</html>
