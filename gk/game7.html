<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片拼拼看 - Jigsaw Puzzle</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #F3E5F5; touch-action: none; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .puzzle-area {
    display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 10px;
  }

  /* 拼圖網格 (目標 3x3) */
  .puzzle-grid {
    display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px);
    gap: 2px; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 15px;
    border: 3px dashed var(--muted);
  }
  .puzzle-slot {
    width: 90px; height: 90px; background: rgba(255,255,255,0.3);
    border-radius: 5px; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .puzzle-slot.filled { background: #E8F5E9; border: none; }

  /* 碎片區域 */
  .pieces-pool {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    min-height: 120px; padding: 15px; background: white; border-radius: 20px;
    width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  .piece {
    width: 70px; height: 70px; background: #FFF9C4; border-radius: 8px;
    cursor: grab; display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    position: relative; overflow: hidden; border: 1px solid white;
    touch-action: none;
  }

  /* 3x3 Clip-path 邏輯 */
  .p0 { clip-path: inset(0 66.6% 66.6% 0); transform: scale(3) translate(33.3%, 33.3%); }
  .p1 { clip-path: inset(0 33.3% 66.6% 33.3%); transform: scale(3) translate(0%, 33.3%); }
  .p2 { clip-path: inset(0 0 66.6% 66.6%); transform: scale(3) translate(-33.3%, 33.3%); }
  .p3 { clip-path: inset(33.3% 66.6% 33.3% 0); transform: scale(3) translate(33.3%, 0%); }
  .p4 { clip-path: inset(33.3% 33.3% 33.3% 33.3%); transform: scale(3) translate(0%, 0%); }
  .p5 { clip-path: inset(33.3% 0 33.3% 66.6%); transform: scale(3) translate(-33.3%, 0%); }
  .p6 { clip-path: inset(66.6% 66.6% 0 0); transform: scale(3) translate(33.3%, -33.3%); }
  .p7 { clip-path: inset(66.6% 33.3% 0 33.3%); transform: scale(3) translate(0%, -33.3%); }
  .p8 { clip-path: inset(66.6% 0 0 66.6%); transform: scale(3) translate(-33.3%, -33.3%); }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:15px; text-align:center; background:var(--pink); color:white;">
  <a href="index.html#p2" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 返回</a>
  <h1>🧩 圖片拼拼看</h1>
</header>

<div class="game-container">
  <div style="font-weight:800; color:var(--text);" id="instruction">拼出正確的圖案！ (3x3)</div>
  
  <div class="puzzle-area">
    <div class="puzzle-grid" id="grid">
      <div class="puzzle-slot" data-idx="0"></div>
      <div class="puzzle-slot" data-idx="1"></div>
      <div class="puzzle-slot" data-idx="2"></div>
      <div class="puzzle-slot" data-idx="3"></div>
      <div class="puzzle-slot" data-idx="4"></div>
      <div class="puzzle-slot" data-idx="5"></div>
      <div class="puzzle-slot" data-idx="6"></div>
      <div class="puzzle-slot" data-idx="7"></div>
      <div class="puzzle-slot" data-idx="8"></div>
    </div>

    <div class="pieces-pool" id="pool"></div>
  </div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🧩</div>
  <h2 style="font-size:2.5rem; color:var(--pink);">拼圖大師！</h2>
  <p style="font-size:1.2rem;">3x3 難不倒你！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:40px; border:none; background:var(--pink); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; margin-top:30px; box-shadow:0 8px 0 #D81B60;">
    領取獎牌 🏆
  </button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit7';
const GAME_ID = 'game7';

let vocab = [];
let targetItem = null;
let matches = 0;
let draggedPiece = null;

function init() {
  vocab = shuffle(unitDataMap[UNIT_ID].vocab);
  startRound();
}

function startRound() {
  targetItem = vocab[Math.floor(Math.random() * vocab.length)];
  document.getElementById('instruction').textContent = "拼出這個單字: " + targetItem.word;
  speakText("Puzzle time! Put the pieces of " + targetItem.word + " together.");
  
  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  matches = 0;
  
  // 清空網格
  document.querySelectorAll('.puzzle-slot').forEach(slot => {
    slot.innerHTML = '';
    slot.classList.remove('filled');
  });

  // 建立 9 個碎片
  let pieces = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => {
    const p = document.createElement('div');
    p.className = `piece p${i}`;
    p.textContent = targetItem.icon;
    p.dataset.idx = i;
    p.draggable = true;
    p.ondragstart = () => { draggedPiece = p; };
    p.ontouchstart = () => { draggedPiece = p; };
    return p;
  });

  shuffle(pieces).forEach(p => pool.appendChild(p));

  // 網格落點設定
  document.querySelectorAll('.puzzle-slot').forEach(slot => {
    slot.ondragover = e => e.preventDefault();
    slot.ondrop = () => handleDrop(slot);
  });
}

function handleDrop(slot) {
  if (!draggedPiece) return;
  if (slot.dataset.idx === draggedPiece.dataset.idx) {
    playSound('success');
    slot.appendChild(draggedPiece);
    draggedPiece.draggable = false;
    draggedPiece.style.cursor = 'default';
    slot.classList.add('filled');
    matches++;
    if (matches === 9) winRound();
  } else {
    playSound('error');
    speakText("Wrong spot!");
  }
  draggedPiece = null;
}

// 觸控支援
document.addEventListener('touchend', e => {
  if (!draggedPiece) return;
  const touch = e.changedTouches[0];
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  const slot = target ? target.closest('.puzzle-slot') : null;
  if (slot) handleDrop(slot);
  draggedPiece = null;
});

function winRound() {
  speakText("Great! " + targetItem.word);
  setTimeout(() => {
    document.getElementById('finish-screen').style.display = 'flex';
    speakText("Excellent job! You finished the 3x3 puzzle.");
  }, 1000);
}

function finishGame() {
  setProgress(GAME_ID, 'done');
  location.href = "index.html#p2";
}

init();
</script>
</body>
</html>
