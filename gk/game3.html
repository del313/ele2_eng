<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字敲敲樂 - Whack-a-Mole</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #E8F5E9; overflow: hidden; touch-action: none; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .hole-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
    margin-top: 20px; padding: 15px; background: #8D6E63; border-radius: 30px;
    box-shadow: inset 0 10px 20px rgba(0,0,0,0.3);
  }

  .hole {
    aspect-ratio: 1; background: #3E2723; border-radius: 50%;
    position: relative; overflow: hidden;
    box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
  }

  .mole {
    position: absolute; bottom: -100%; left: 10%; width: 80%; height: 80%;
    background: #FFCA28; border-radius: 50% 50% 0 0;
    display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
    transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer; border: 4px solid white; box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
  }
  .mole.up { bottom: 10%; }
  .mole.hit { transform: scale(0.8); opacity: 0.5; }

  .target-panel {
    background: white; padding: 10px 20px; border-radius: 30px;
    display: inline-flex; align-items: center; gap: 15px;
    border: 4px solid var(--orange); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:15px; text-align:center; background:var(--orange); color:white;">
  <a href="index.html" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 返回</a>
  <h1>🔨 單字敲敲樂</h1>
</header>

<div class="game-container">
  <div class="target-panel" id="target-panel">
    <div style="font-size:1.2rem; font-weight:900;">找找看: <span id="target-word">...</span></div>
    <div id="target-icon" style="font-size:2rem;">❓</div>
  </div>

  <div class="hole-grid" id="grid">
    <div class="hole"><div class="mole" id="mole0"></div></div>
    <div class="hole"><div class="mole" id="mole1"></div></div>
    <div class="hole"><div class="mole" id="mole2"></div></div>
    <div class="hole"><div class="mole" id="mole3"></div></div>
    <div class="hole"><div class="mole" id="mole4"></div></div>
    <div class="hole"><div class="mole" id="mole5"></div></div>
    <div class="hole"><div class="mole" id="mole6"></div></div>
    <div class="hole"><div class="mole" id="mole7"></div></div>
    <div class="hole"><div class="mole" id="mole8"></div></div>
  </div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🏅</div>
  <h2 style="font-size:2.5rem; color:var(--orange);">太厲害了！</h2>
  <p style="font-size:1.2rem;">你的反應真快！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:40px; border:none; background:var(--orange); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; margin-top:30px; box-shadow:0 8px 0 #F57C00;">
    領取獎牌 🏆
  </button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit3';
const GAME_ID = 'game3';

let vocab = [];
let targetIndex = 0;
let score = 0;
let activeMole = -1;
let gameActive = true;

function init() {
  vocab = shuffle(unitDataMap[UNIT_ID].vocab);
  updateTarget();
  nextMole();
}

function updateTarget() {
  const target = vocab[targetIndex];
  document.getElementById('target-word').textContent = target.word;
  document.getElementById('target-icon').textContent = target.icon;
  speakText("Find " + target.word);
}

function nextMole() {
  if (!gameActive) return;

  const moleIdx = Math.floor(Math.random() * 9);
  const isTarget = Math.random() > 0.5;
  const item = isTarget ? vocab[targetIndex] : vocab[Math.floor(Math.random() * vocab.length)];
  
  const mole = document.getElementById('mole' + moleIdx);
  mole.textContent = item.icon;
  mole.classList.add('up');
  
  mole.onclick = () => {
    if (item.word === vocab[targetIndex].word) {
      hit(mole);
    }
  };

  setTimeout(() => {
    mole.classList.remove('up');
    mole.onclick = null;
    if (gameActive) setTimeout(nextMole, 600 + Math.random() * 1000);
  }, 1200);
}

function hit(el) {
  el.classList.add('hit');
  speakText("Zap!");
  score++;
  targetIndex = (targetIndex + 1) % vocab.length;
  
  if (score >= 8) {
    win();
  } else {
    updateTarget();
  }
}

function win() {
  gameActive = false;
  document.getElementById('finish-screen').style.display = 'flex';
  speakText("Excellent! You caught them all.");
}

function finishGame() {
  setProgress(GAME_ID, 'done');
  location.href = 'index.html';
}

init();
</script>
</body>
</html>
