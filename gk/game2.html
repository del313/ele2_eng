<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>對對碰 - Tap the Pair</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  body { background: #FCE4EC; }
  .game-container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
  
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
    margin-top: 20px; perspective: 1000px;
  }

  .card {
    height: 110px; cursor: pointer; position: relative;
    transform-style: preserve-3d; transition: transform 0.5s;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.matched { visibility: hidden; opacity: 0; transition: all 0.5s 0.3s; }

  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-size: 2.5rem;
  }
  .card-front { background: var(--pink); color: white; border: 4px solid white; }
  .card-back { background: white; transform: rotateY(180deg); border: 4px solid var(--pink); }

  #finish-screen {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header style="padding:15px; text-align:center; background:var(--pink); color:white;">
  <a href="index.html#p1" style="position:absolute; left:20px; color:white; text-decoration:none; font-weight:800;">🏠 返回</a>
  <h1>🎴 對對碰</h1>
</header>

<div class="game-container">
  <div style="font-weight:800; color:var(--text); margin-bottom:10px;">找出一樣的圖片！</div>
  <div class="board" id="board"></div>
</div>

<div id="finish-screen">
  <div style="font-size:6rem;">🏆</div>
  <h2 style="font-size:2.5rem; color:var(--pink);">你好棒！</h2>
  <p style="font-size:1.2rem;">你記住了所有的圖案！</p>
  <button onclick="finishGame()" style="padding:15px 50px; border-radius:40px; border:none; background:var(--pink); color:white; font-size:1.5rem; font-weight:900; cursor:pointer; margin-top:30px; box-shadow:0 8px 0 #D81B60;">
    領取獎牌 🏅
  </button>
</div>

<script src="kinder.js"></script>
<script>
const UNIT_ID = 'unit2';
const GAME_ID = 'game2';

let cards = [];
let flipped = [];
let matches = 0;

function init() {
  const items = unitDataMap[UNIT_ID].vocab.slice(0, 6);
  // 建立兩兩一組的牌組
  const deck = [...items, ...items];
  const shuffled = shuffle(deck);

  const board = document.getElementById('board');
  shuffled.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.word = item.word;
    card.innerHTML = `
      <div class="card-face card-front">🎁</div>
      <div class="card-face card-back">${item.icon}</div>
    `;
    card.onclick = () => flipCard(card);
    board.appendChild(card);
    cards.push(card);
  });
}

function flipCard(card) {
  if (flipped.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    checkMatch();
  }
}

function checkMatch() {
  const [c1, c2] = flipped;
  if (c1.dataset.word === c2.dataset.word) {
    playSound('success');
    matches++;
    speakText(c1.dataset.word);
    setTimeout(() => {
      c1.classList.add('matched');
      c2.classList.add('matched');
      flipped = [];
      if (matches === 6) win();
    }, 600);
  } else {
    playSound('error');
    setTimeout(() => {
      c1.classList.remove('flipped');
      c2.classList.remove('flipped');
      flipped = [];
    }, 1000);
  }
}

function win() {
  setTimeout(() => {
    document.getElementById('finish-screen').style.display = 'flex';
    speakText("Great job! You found all pairs.");
  }, 800);
}

function finishGame() {
  setProgress(GAME_ID, 'done');
  location.href = "index.html#p1";
}

init();
</script>
</body>
</html>
