<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 1 – 單字大富翁</title>
<script src="../js-common.js"></script>
<style>
  :root {
    --orange: #FF8C00; --yellow: #FFD700; --light: #FFF8EC;
    --green: #4CAF50;  --blue: #2196F3;   --pink: #E91E8C;
    --radius: 16px; --text: #333; --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #7B1FA2, #E91E8C);
    color: white; padding: 14px 20px; text-align: center; position: relative;
  }
  header h1 { font-size: 1.5rem; font-weight: 900; }
  header p  { font-size: 12px; opacity: .8; margin-top: 3px; }
  .home-btn {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.25); border: none; border-radius: 10px;
    color: white; font-size: 13px; font-weight: 700;
    padding: 5px 11px; cursor: pointer; text-decoration: none; display: inline-block;
  }

  /* PLAYER BAR */
  .player-bar {
    display: flex; gap: 10px; padding: 12px 14px;
    max-width: 640px; margin: 0 auto;
  }
  .player-card {
    flex: 1; background: white; border-radius: var(--radius);
    padding: 10px 14px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    border: 3px solid transparent; transition: border-color .3s;
  }
  .player-card.active { border-color: var(--orange); background: #FFF3E0; }
  .player-card .p-icon { font-size: 1.8rem; }
  .player-card .p-name { font-size: 13px; font-weight: 800; margin-top: 2px; }
  .player-card .p-pos  { font-size: 12px; color: var(--muted); }
  .turn-label {
    text-align: center; font-size: 14px; font-weight: 800;
    color: var(--orange); padding: 0 0 8px;
  }

  /* BOARD */
  .board-wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 10px; }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .sq {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    position: relative; cursor: default;
    border: 2px solid rgba(0,0,0,.07);
    min-height: 54px;
    text-align: center;
    padding: 3px;
  }
  .sq .sq-num { font-size: 10px; position: absolute; top: 3px; left: 5px; opacity: .5; }
  .sq .sq-icon { font-size: 1.3rem; line-height: 1; }
  .sq .sq-tokens { position: absolute; bottom: 2px; right: 3px; font-size: 1.4rem; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
  .sq.normal  { background: white; }
  .sq.bonus   { background: #E8F5E9; border-color: #A5D6A7; }
  .sq.penalty { background: #FFEBEE; border-color: #FFCDD2; }
  .sq.start   { background: linear-gradient(135deg,#E3F2FD,#BBDEFB); border-color: #90CAF9; }
  .sq.finish  { background: linear-gradient(135deg,#FFF9C4,#FFF176); border-color: #FDD835; }
  .sq.active-sq-0 {
    z-index: 2;
    animation: sq-pulse-0 1s ease-in-out infinite alternate;
  }
  @keyframes sq-pulse-0 {
    from { box-shadow: 0 0 0 4px #FF8C00, 0 0 10px 2px rgba(255,140,0,.35); transform: scale(1); }
    to   { box-shadow: 0 0 0 5px #FF8C00, 0 0 22px 6px rgba(255,140,0,.55); transform: scale(1.07); }
  }
  .sq.active-sq-1 {
    z-index: 2;
    animation: sq-pulse-1 1s ease-in-out infinite alternate;
  }
  @keyframes sq-pulse-1 {
    from { box-shadow: 0 0 0 4px #2196F3, 0 0 10px 2px rgba(33,150,243,.35); transform: scale(1); }
    to   { box-shadow: 0 0 0 5px #2196F3, 0 0 22px 6px rgba(33,150,243,.55); transform: scale(1.07); }
  }

  /* DICE */
  .dice-area {
    max-width: 640px; margin: 0 auto;
    padding: 10px 14px; text-align: center;
  }
  .dice {
    display: inline-block; width: 60px; height: 60px;
    background: white; border-radius: 14px;
    border: 3px solid var(--orange);
    font-size: 2rem; line-height: 54px;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
    margin-bottom: 10px; cursor: pointer;
    transition: transform .1s;
    user-select: none;
  }
  .dice:active { transform: scale(.93); }
  .dice.rolling { animation: roll-anim .5s ease; }
  @keyframes roll-anim {
    0%   { transform: rotate(0deg) scale(1); }
    25%  { transform: rotate(-20deg) scale(1.15); }
    50%  { transform: rotate(15deg) scale(0.9); }
    75%  { transform: rotate(-10deg) scale(1.1); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .roll-btn {
    display: block; margin: 0 auto;
    background: linear-gradient(135deg,#7B1FA2,#E91E8C);
    color: white; border: none; border-radius: 24px;
    padding: 12px 32px; font-size: 1rem; font-weight: 900;
    cursor: pointer; box-shadow: 0 4px 14px rgba(123,31,162,.3);
    transition: transform .15s;
  }
  .roll-btn:hover { transform: translateY(-2px); }
  .roll-btn:disabled { opacity: .4; pointer-events: none; }

  /* MODAL */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.55); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: white; border-radius: 24px;
    padding: 26px 22px; width: 92%; max-width: 400px;
    text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.2);
    animation: pop-in .25s ease;
  }
  @keyframes pop-in { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
  .modal .m-label { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
  .modal .m-zh { font-size: 2.2rem; font-weight: 900; color: #333; margin-bottom: 18px; line-height: 1.2; }
  .modal .m-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .m-btn {
    background: #F5F5F5; border: 3px solid #E0E0E0;
    border-radius: 14px; padding: 13px 8px;
    font-size: 1rem; font-weight: 800; cursor: pointer; transition: all .18s;
  }
  .m-btn:hover { border-color: var(--orange); background: #FFF3E0; }
  .m-btn.correct { border-color: var(--green); background: #E8F5E9; color: #2E7D32; }
  .m-btn.wrong   { border-color: #f44336; background: #FFEBEE; color: #c62828; }
  .m-result { font-size: 1rem; font-weight: 800; min-height: 26px; }
  .m-result.ok  { color: var(--green); }
  .m-result.no  { color: #f44336; }
  .m-next-btn {
    display: none; margin: 12px auto 0;
    background: var(--orange); color: white;
    border: none; border-radius: 24px;
    padding: 10px 26px; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .sq-type-label { font-size: 11px; font-weight: 700; }

  /* SPECIAL MODAL */
  .special-modal .m-icon { font-size: 3rem; margin-bottom: 10px; }
  .special-modal .m-msg  { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
  .special-modal .m-sub  { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

  /* WIN SCREEN */
  .win-screen {
    display: none; position: fixed; inset: 0;
    background: linear-gradient(135deg, #7B1FA2, #E91E8C);
    z-index: 300; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 30px;
    color: white;
  }
  .win-screen.show { display: flex; }
  .win-screen .w-icon { font-size: 5rem; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-14px)} }
  .win-screen h2 { font-size: 2rem; font-weight: 900; margin: 16px 0 8px; }
  .win-screen p  { font-size: 1.1rem; opacity: .9; margin-bottom: 28px; }
  .win-btn {
    background: white; color: #7B1FA2;
    border: none; border-radius: 24px;
    padding: 14px 34px; font-size: 1rem; font-weight: 900;
    cursor: pointer; margin: 6px; text-decoration: none; display: inline-block;
  }
</style>
</head>
<body>

<header>
  <a href="index.html#p1" class="home-btn btn-hover">🏠 首頁</a>
  <h1>🎲 單字大富翁</h1>
  <p>Unit 1–4 複習闖關 · 先到終點贏！</p>
</header>

<!-- PLAYER BAR -->
<div class="player-bar btn-hover">
  <div class="player-card active btn-hover" id="p0card">
    <div class="p-icon btn-hover">🧒</div>
    <div class="p-name btn-hover">小孩</div>
    <div class="p-pos btn-hover" id="p0pos">格子 0</div>
  </div>
  <div style="display:flex;align-items:center;font-size:1.5rem;color:var(--muted)">VS</div>
  <div class="player-card btn-hover" id="p1card">
    <div class="p-icon btn-hover">🧑</div>
    <div class="p-name btn-hover">家長</div>
    <div class="p-pos btn-hover" id="p1pos">格子 0</div>
  </div>
</div>
<div class="turn-label btn-hover" id="turnLabel">🧒 小孩的回合</div>

<!-- BOARD -->
<div class="board-wrap btn-hover">
  <div class="board btn-hover" id="board"></div>
</div>

<!-- DICE -->
<div class="dice-area btn-hover">
  <div class="dice btn-hover" id="dice">🎲</div>
  <button class="roll-btn btn-hover" id="rollBtn" onclick="rollDice()">擲骰子！</button>
</div>

<!-- QUESTION MODAL -->
<div class="modal-bg btn-hover" id="qModal">
  <div class="modal btn-hover">
    <div class="m-label btn-hover">看中文，選英文單字</div>
    <div class="m-zh btn-hover" id="mZh"></div>
    <div class="m-choices btn-hover" id="mChoices"></div>
    <div class="m-result btn-hover" id="mResult"></div>
    <button class="m-next-btn btn-hover" id="mNextBtn" onclick="closeModal()">繼續 →</button>
  </div>
</div>

<!-- SPECIAL MODAL (bonus/penalty) -->
<div class="modal-bg btn-hover" id="spModal">
  <div class="modal special-modal btn-hover">
    <div class="m-icon btn-hover" id="spIcon"></div>
    <div class="m-msg btn-hover"  id="spMsg"></div>
    <div class="m-sub btn-hover"  id="spSub"></div>
    <button class="m-next-btn btn-hover" style="display:block" onclick="closeSpecial()">繼續 →</button>
  </div>
</div>

<!-- WIN SCREEN -->
<div class="win-screen btn-hover" id="winScreen">
  <div class="w-icon btn-hover" id="winIcon"></div>
  <h2 id="winTitle"></h2>
  <p id="winMsg"></p>
  <button class="win-btn btn-hover" onclick="resetGame()">🔄 再玩一次</button>
  <a class="win-btn btn-hover" href="index.html#p1">🏠 回首頁</a>
</div>

<script>
// ── VOCABULARY (Unit 1–4 core words) ──
const allVocab = [
  // Unit 1
  {en:'name',zh:'名字'},{en:'old',zh:'歲數的'},{en:'grade',zh:'年級'},
  {en:'favorite',zh:'最喜歡的'},{en:'color',zh:'顏色'},{en:'food',zh:'食物'},
  {en:'friend',zh:'朋友'},{en:'hello',zh:'你好'},
  // Unit 2
  {en:'father',zh:'爸爸'},{en:'mother',zh:'媽媽'},{en:'brother',zh:'哥哥/弟弟'},
  {en:'sister',zh:'姐姐/妹妹'},{en:'family',zh:'家庭'},{en:'grandpa',zh:'爺爺/外公'},
  {en:'grandma',zh:'奶奶/外婆'},{en:'baby',zh:'嬰兒/寶寶'},
  // Unit 3
  {en:'pencil',zh:'鉛筆'},{en:'book',zh:'書'},{en:'bag',zh:'書包'},
  {en:'ruler',zh:'尺'},{en:'eraser',zh:'橡皮擦'},{en:'desk',zh:'課桌'},
  {en:'chair',zh:'椅子'},{en:'classroom',zh:'教室'},
  // Unit 4
  {en:'apple',zh:'蘋果'},{en:'rice',zh:'米飯'},{en:'milk',zh:'牛奶'},
  {en:'bread',zh:'麵包'},{en:'water',zh:'水'},{en:'cake',zh:'蛋糕'},
  {en:'egg',zh:'雞蛋'},{en:'noodle',zh:'麵條'},
];

// ── BOARD SETUP ──
// 20 squares + start(0) + finish(21) = 22 positions
// Displayed in snake pattern: row3 left→right, row2 right→left, row1 left→right, row0 right→left
const TOTAL = 21; // finish square index
const ROWS = 4, COLS = 5; // 4×5 = 20 inner squares + start/finish handled separately

// Square types: 'normal' | 'bonus' | 'penalty' | 'start' | 'finish'
// Layout: 22 squares total (0=start, 1-20=play, 21=finish)
const squareTypes = [
  'start',                                    // 0
  'normal','normal','bonus','normal','normal', // 1-5
  'normal','penalty','normal','normal','bonus',// 6-10
  'normal','normal','bonus','normal','penalty',// 11-15
  'normal','normal','normal','bonus','normal', // 16-20
  'finish'                                     // 21
];
const squareIcons = {
  start:'🏁', finish:'🏆',
  bonus:'⭐', penalty:'💀', normal:'',
};

// Snake order: position index → grid cell
// Row 3 (bottom): positions 1-5 left→right → cols 0-4
// Row 2: positions 6-10 right→left → cols 4-0
// Row 1: positions 11-15 left→right → cols 0-4
// Row 0 (top): positions 16-20 right→left → cols 4-0
// Start: extra cell before row 3; Finish: extra cell after row 0
// For simplicity, render all 22 squares in a 5-wide grid:
// We'll render: [start, 1,2,3,4,5, 10,9,8,7,6, 11,12,13,14,15, 20,19,18,17,16, finish + 4 empty]
// Actually let me just build a visual order array:
const visualOrder = [
  21,                // top-left = FINISH
  20,19,18,17,16,   // row0 right→left (but finish takes index 0,0)
  11,12,13,14,15,   // row1 left→right
  10,9,8,7,6,       // row2 right→left
  1,2,3,4,5,        // row3 left→right
  0,                 // START (bottom-left)
];
// That's 22 items, but grid is 5 wide, so 5 rows needed: ceil(22/5) = 5 rows (last row has 2 items)
// Let me instead use 22 cells padded to 25 (5×5):
// Row 0: [21,20,19,18,17]  (21=finish, 20-17 = play squares)
// Row 1: [16, empty,empty,empty, empty] — no, this gets messy
// Let me use a cleaner 5×5 approach with positions numbered clearly:

// Revised: 5 rows × 5 cols = 25 cells, but we only use 22.
// Row 0: finish(21), 20, 19, 18, 17
// Row 1: 16, 15, 14, 13, 12
// Row 2: 11, 10, 9,  8,  7
// Row 3: 6,  5,  4,  3,  2
// Row 4: 1, start(0), empty, empty, empty
// Hmm, still awkward. Let me use a 24-cell grid (last 2 cells empty):

const gridOrder = [
  21, 20, 19, 18, 17,   // row 0
  16, 15, 14, 13, 12,   // row 1
  11, 10,  9,  8,  7,   // row 2
   6,  5,  4,  3,  2,   // row 3
   1,  0, -1, -1, -1,   // row 4 (-1 = empty)
];

// Build DOM board
const boardEl = document.getElementById('board');
boardEl.style.gridTemplateColumns = 'repeat(5, 1fr)';
gridOrder.forEach(idx => {
  const cell = document.createElement('div');
  if (idx < 0) { cell.style.visibility = 'hidden'; boardEl.appendChild(cell); return; }
  const t = squareTypes[idx];
  cell.className = `sq ${t}`;
  cell.id = `sq-${idx}`;
  cell.innerHTML = `<span class="sq-num btn-hover">${idx === 0 ? 'S' : idx === TOTAL ? 'G' : idx}</span><span class="sq-icon btn-hover">${squareIcons[t] || ''}</span><span class="sq-tokens btn-hover" id="tok-${idx}"></span>`;
  boardEl.appendChild(cell);
});

// ── GAME STATE ──
const players = [
  { name:'小孩', icon:'🧒', pos:0 },
  { name:'家長', icon:'🧑', pos:0 },
];
let currentPlayer = 0;
let answeredCorrect = false;
let pendingMove = 0;
let modalAnswered = false;

const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

function renderTokens() {
  // Clear all tokens
  document.querySelectorAll('.sq-tokens').forEach(el => el.textContent = '');
  // Place tokens
  players.forEach(p => {
    const tok = document.getElementById(`tok-${p.pos}`);
    if (tok) tok.textContent += p.icon;
  });
  // Highlight current squares (each player gets own color)
  document.querySelectorAll('.sq.active-sq-0,.sq.active-sq-1').forEach(el => {
    el.classList.remove('active-sq-0','active-sq-1');
  });
  players.forEach((p, i) => {
    const sq = document.getElementById(`sq-${p.pos}`);
    if (sq) sq.classList.add(`active-sq-${i}`);
  });
}

function updateUI() {
  const p = players[currentPlayer];
  document.getElementById('p0card').classList.toggle('active', currentPlayer === 0);
  document.getElementById('p1card').classList.toggle('active', currentPlayer === 1);
  document.getElementById('p0pos').textContent = players[0].pos === TOTAL ? '🏆 終點！' : `格子 ${players[0].pos}`;
  document.getElementById('p1pos').textContent = players[1].pos === TOTAL ? '🏆 終點！' : `格子 ${players[1].pos}`;
  document.getElementById('turnLabel').textContent = `${p.icon} ${p.name}的回合`;
}

function rollDice() {
  const btn = document.getElementById('rollBtn');
  btn.disabled = true;
  const diceEl = document.getElementById('dice');
  diceEl.classList.add('rolling');

  let count = 0;
  const flickInterval = setInterval(() => {
    diceEl.textContent = DICE_FACES[Math.floor(Math.random() * 6)];
    count++;
    if (count >= 10) {
      clearInterval(flickInterval);
      diceEl.classList.remove('rolling');
      const roll = Math.floor(Math.random() * 6) + 1;
      diceEl.textContent = DICE_FACES[roll - 1];
      setTimeout(() => handleMove(roll), 400);
    }
  }, 60);
}

function handleMove(roll) {
  const p = players[currentPlayer];
  const newPos = Math.min(p.pos + roll, TOTAL);
  p.pos = newPos;
  renderTokens();

  if (newPos === TOTAL) { setTimeout(showWin, 400); return; }

  const t = squareTypes[newPos];
  if (t === 'bonus') {
    setTimeout(() => showSpecial('bonus'), 400);
  } else if (t === 'penalty') {
    setTimeout(() => showSpecial('penalty'), 400);
  } else {
    setTimeout(showQuestion, 400);
  }
}

// ── QUESTION ──
function shuffle(a) { return [...a].sort(() => Math.random() - .5); }

function showQuestion() {
  modalAnswered = false;
  answeredCorrect = false;
  const correct = allVocab[Math.floor(Math.random() * allVocab.length)];
  const wrongs = shuffle(allVocab.filter(v => v.en !== correct.en)).slice(0, 3);
  const choices = shuffle([correct, ...wrongs]);

  document.getElementById('mZh').textContent = correct.zh;
  document.getElementById('mResult').textContent = '';
  document.getElementById('mResult').className = 'm-result';
  document.getElementById('mNextBtn').style.display = 'none';

  const cont = document.getElementById('mChoices');
  cont.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'm-btn'; btn.textContent = c.en;
    btn.onclick = () => {
      if (modalAnswered) return;
      modalAnswered = true;
      const isCorrect = c.en === correct.en;
      answeredCorrect = isCorrect;
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
      if (isCorrect) playSound('success'); else playSound('error');
      if (!isCorrect) cont.querySelectorAll('.m-btn').forEach(b => { if (b.textContent === correct.en) b.classList.add('correct'); });
      const res = document.getElementById('mResult');
      res.textContent = isCorrect ? '✅ 答對了！留在原位 🎉' : `❌ 答錯了！是「${correct.en}」，退後1格`;
      res.className = 'm-result ' + (isCorrect ? 'ok' : 'no');
      document.getElementById('mNextBtn').style.display = 'block';
    };
    cont.appendChild(btn);
  });

  document.getElementById('qModal').classList.add('show');
}

function closeModal() {
  document.getElementById('qModal').classList.remove('show');
  if (!answeredCorrect) {
    const p = players[currentPlayer];
    p.pos = Math.max(0, p.pos - 1);
    renderTokens();
  }
  nextTurn();
}

// ── SPECIAL SQUARES ──
function showSpecial(type) {
  const p = players[currentPlayer];
  const isBonus = type === 'bonus';
  document.getElementById('spIcon').textContent = isBonus ? '⭐' : '💀';
  document.getElementById('spMsg').textContent  = isBonus ? '幸運格！前進 2 格！' : '危險格！退後 2 格…';
  document.getElementById('spSub').textContent  = isBonus ? '加油繼續！' : '下次小心！';
  document.getElementById('spModal').classList.add('show');

  // Pre-apply movement
  if (isBonus) p.pos = Math.min(p.pos + 2, TOTAL);
  else         p.pos = Math.max(p.pos - 2, 0);
  renderTokens();
  if (p.pos === TOTAL) {
    document.getElementById('spModal').classList.remove('show');
    setTimeout(showWin, 200);
  }
}

function closeSpecial() {
  document.getElementById('spModal').classList.remove('show');
  nextTurn();
}

function nextTurn() {
  currentPlayer = 1 - currentPlayer;
  updateUI();
  document.getElementById('rollBtn').disabled = false;
}

// ── WIN ──
function showWin() {
  const p = players[currentPlayer];
  document.getElementById('winIcon').textContent = p.icon;
  document.getElementById('winTitle').textContent = `${p.name} 贏了！`;
  document.getElementById('winMsg').textContent = '太厲害了！🎉 你完成了 Unit 1–4 的單字大富翁！';
  document.getElementById('winScreen').classList.add('show');

  // Save game1 done
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  prog['game1'] = 'done';
  localStorage.setItem('progress_g4', JSON.stringify(prog));
}

function resetGame() {
  players[0].pos = 0; players[1].pos = 0;
  currentPlayer = 0;
  document.getElementById('winScreen').classList.remove('show');
  document.getElementById('dice').textContent = '🎲';
  document.getElementById('rollBtn').disabled = false;
  renderTokens();
  updateUI();
}

// ── INIT ──
// Mark in_progress
(function() {
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  if (prog['game1'] !== 'done') { prog['game1'] = 'in_progress'; localStorage.setItem('progress_g4', JSON.stringify(prog)); }
})();

renderTokens();
updateUI();
</script>
