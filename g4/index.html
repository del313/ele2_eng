<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小四英文課程 – Grade 4</title>
<link rel="stylesheet" href="../style-common.css">
<style>
  /* header-btns */
  .header-btns {
    display: flex;
    justify-content: space-between;
    margin: 15px auto 0 auto;
    max-width: 800px;
    padding: 0 20px;
    gap: 20px;
  }
  .back-home-btn, .reset-progress-btn {
    box-sizing: border-box;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    color: white;
    font-size: 13px;
    font-weight: 800;
    padding: 0;
    height: 40px;
    width: 130px;
    text-decoration: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    margin: 0 !important;
  }
  .back-home-btn:hover, .reset-progress-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
  }
</style>
</head>
<body>

<header>
  <h1>📚 小四英文課程</h1>
  <p>Grade 4 English · 12 Units + 6 Games</p>
  <div class="progress-wrap btn-hover">
    <div class="progress-bar btn-hover" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label btn-hover" id="progressLabel">0 / 18 完成</div>
  <div class="header-btns btn-hover">
    <button class="reset-progress-btn btn-hover" onclick="resetProgress()">🔄 重設進度</button>
    <a href="../index.html" class="back-home-btn btn-hover">🏠 回首頁</a>
  </div>
</header>

<div class="container btn-hover">

  <div class="continue-banner hidden btn-hover" id="continueBanner">
    <div class="cb-text btn-hover" style="font-size: 1.1rem;">繼續挑戰：<span id="continueTitle" style="color:#F57C00"></span></div>
    <a href="#" class="cb-btn btn-hover" id="continueLink" style="background:#F57C00; color:white; padding:10px 20px; border-radius:30px; text-decoration:none; font-weight:800; margin-left:15px;">GO! →</a>
  </div>

  <!-- UNITS 1–4 -->
  <div class="section-label btn-hover" id="p1">第一章：認識自己與家人 (Unit 1-4)</div>
  <div class="card-grid btn-hover" id="group1"></div>
  <div class="game-grid btn-hover" id="games-p1"></div>

  <!-- UNITS 5–8 -->
  <div class="section-label btn-hover" id="p2" style="margin-top:40px;">第二章：生活與自然 (Unit 5-8)</div>
  <div class="card-grid btn-hover" id="group2"></div>
  <div class="game-grid btn-hover" id="games-p2"></div>

  <!-- UNITS 9–12 -->
  <div class="section-label btn-hover" id="p3" style="margin-top:40px;">第三章：能力與世界 (Unit 9-12)</div>
  <div class="card-grid btn-hover" id="group3"></div>
  <div class="game-grid btn-hover" id="games-p3"></div>

  <div class="legend btn-hover">
    <div class="legend-item btn-hover"><div class="legend-dot btn-hover" style="background:#FFF;border:3px solid #4FC3F7"></div> 準備好</div>
    <div class="legend-item btn-hover"><div class="legend-dot btn-hover" style="background:#FFFDE7;border:3px solid #FFB74D"></div> 進行中</div>
    <div class="legend-item btn-hover"><div class="legend-dot btn-hover" style="background:#F1F8E9;border:3px solid #81C784"></div> 已完成</div>
    <div class="legend-item btn-hover"><div class="legend-dot btn-hover" style="background:#ECEFF1;border:3px solid #D1D9E0"></div> 鎖定中</div>
  </div>

</div>

<script>
const units = [
  { id:'unit1',  title:"Hello, I'm Me!", sub:'自我介紹',    icon:'🌟', file:'unit1.html'  },
  { id:'unit2',  title:'My Family',      sub:'家庭成員',    icon:'👨‍👩‍👧', file:'unit2.html'  },
  { id:'unit3',  title:'School Days',    sub:'學校文具',    icon:'🎒', file:'unit3.html'  },
  { id:'unit4',  title:'I Love Food',    sub:'食物飲料',    icon:'🍎', file:'unit4.html'  },
  { id:'unit5',  title:'Animals Are Cool',sub:'動物',       icon:'🐶', file:'unit5.html'  },
  { id:'unit6',  title:'My Day',         sub:'時間作息',    icon:'⏰', file:'unit6.html'  },
  { id:'unit7',  title:'Colors & Clothes',sub:'顏色衣物',   icon:'👕', file:'unit7.html'  },
  { id:'unit8',  title:"How's the Weather?",sub:'天氣季節', icon:'🌤', file:'unit8.html'  },
  { id:'unit9',  title:'I Can Do It!',   sub:'能力嗜好',    icon:'💪', file:'unit9.html'  },
  { id:'unit10', title:'In the City',    sub:'城市場所',    icon:'🏙', file:'unit10.html' },
  { id:'unit11', title:'My Body',        sub:'身體部位',    icon:'🙋', file:'unit11.html' },
  { id:'unit12', title:'Show & Tell',    sub:'綜合發表',    icon:'🎤', file:'unit12.html' },
];

const games = [
  { id:'game1', title:'單字大富翁', sub:'Unit 1–4 複習', icon:'🎲', file:'game1.html', phase: 1, unlockAfter:['unit1','unit2','unit3','unit4'] },
  { id:'game4', title:'限時配對',   sub:'Unit 1–4 挑戰', icon:'🧠', file:'game4.html', phase: 1, unlockAfter:['unit1','unit2','unit3','unit4'] },
  { id:'game2', title:'打地鼠',     sub:'Unit 5–8 複習', icon:'🔨', file:'game2.html', phase: 2, unlockAfter:['unit5','unit6','unit7','unit8'] },
  { id:'game5', title:'疾速氣球',   sub:'Unit 5–8 挑戰', icon:'🎈', file:'game5.html', phase: 2, unlockAfter:['unit5','unit6','unit7','unit8'] },
  { id:'game3', title:'句子拼圖',   sub:'Unit 9–12 複習', icon:'🧩', file:'game3.html', phase: 3, unlockAfter:['unit9','unit10','unit11','unit12'] },
  { id:'game6', title:'聽音拼字',   sub:'Unit 9–12 挑戰', icon:'🎧', file:'game6.html', phase: 3, unlockAfter:['unit9','unit10','unit11','unit12'] },
];

const unitSequence = units.map(u => u.id);
const PROGRESS_KEY = 'progress_g4';
const progress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');

window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

function resetProgress() {
  if (confirm('確定要清除所有進度嗎？')) {
    localStorage.removeItem(PROGRESS_KEY);
    location.reload();
  }
}

function getState(id) {
  if (progress[id] === 'done') return 'done';
  if (id.startsWith('unit') && progress[id] === 'in_progress') return 'in-progress';

  if (id.startsWith('unit')) {
    const idx = unitSequence.indexOf(id);
    if (idx === 0) return 'available';
    const prev = unitSequence[idx - 1];
    if (progress[prev] === 'done') return 'available';
    return 'locked';
  } else if (id.startsWith('game')) {
    const game = games.find(g => g.id === id);
    const allDone = game.unlockAfter.every(u => progress[u] === 'done');
    return allDone ? 'available' : 'locked';
  }
  return 'locked';
}

function makeUnitCard(u, num) {
  const state = getState(u.id);
  const a = document.createElement('a');
  a.className = `unit-card ${state}`;
  a.href = state === 'locked' ? '#' : u.file;
  if (state === 'locked') a.onclick = e => e.preventDefault();
  const badge = state === 'done' ? '⭐' : state === 'in-progress' ? '▶️' : state === 'locked' ? '🔒' : '';
  a.innerHTML = `
    ${badge ? `<div class="card-badge btn-hover">${badge}</div>` : ''}
    <div class="card-num btn-hover">UNIT ${num}</div>
    <div class="card-icon btn-hover">${u.icon}</div>
    <div class="card-title btn-hover">${u.title}</div>
    <div class="card-sub btn-hover">${u.sub}</div>`;
  return a;
}

function makeGameCard(game) {
  const state = getState(game.id);
  const a = document.createElement('a');
  a.className = `game-card ${state}`;
  a.href = state === 'locked' ? '#' : game.file;
  if (state === 'locked') a.onclick = e => e.preventDefault();
  const badge = state === 'done' ? ' 🏆' : state === 'locked' ? ' 🔒' : ' 🎮';
  a.innerHTML = `
    <div class="card-icon btn-hover">${game.icon}</div>
    <div class="content btn-hover">
      <div class="card-title btn-hover">${game.title}${badge}</div>
      <div class="card-sub btn-hover">${game.sub}</div>
    </div>`;
  return a;
}

// Render units (4 per group)
[units.slice(0,4), units.slice(4,8), units.slice(8,12)].forEach((group, gi) => {
  const grid = document.getElementById(`group${gi+1}`);
  if (grid) group.forEach((u, i) => grid.appendChild(makeUnitCard(u, gi*4 + i + 1)));
});

// Render games — auto single/double column
[1, 2, 3].forEach(phase => {
  const area = document.getElementById(`games-p${phase}`);
  if (!area) return;
  const phaseGames = games.filter(g => g.phase === phase);
  // Set single class if only 1 game
  if (phaseGames.length === 1) area.classList.add('single');
  phaseGames.forEach(g => area.appendChild(makeGameCard(g)));
});

// Progress bar
const sequence = [...unitSequence, ...games.map(g => g.id)];
const total = sequence.length;
const done = sequence.filter(id => progress[id] === 'done').length;
document.getElementById('progressBar').style.width = `${Math.round(done/total*100)}%`;
document.getElementById('progressLabel').textContent = `${done} / ${total} 完成`;

// Continue banner
const targetUnit = unitSequence.find(id => progress[id] !== 'done');
const target = targetUnit || games.map(g => g.id).find(id => progress[id] !== 'done');
if (target) {
  const state = getState(target);
  if (state !== 'locked') {
    const banner = document.getElementById('continueBanner');
    banner.classList.remove('hidden');
    banner.style.display = 'flex';
    const u = units.find(x => x.id === target) || games.find(x => x.id === target);
    if (u) {
      document.getElementById('continueTitle').textContent = u.title;
      document.getElementById('continueLink').href = u.file;
    }
  }
}

// 錨點自動滾動
window.addEventListener('load', () => {
  if (window.location.hash) {
    const el = document.getElementById(window.location.hash.substring(1));
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 500);
  }
});
</script>
</html>
