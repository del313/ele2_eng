<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 5 – 疾速氣球射手</title>
<style>
  :root {
    --green: #4CAF50; --dgreen: #2E7D32; --light: #F1F8E9;
    --orange: #FF8C00; --red: #f44336; --radius: 16px;
    --text: #333; --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--light);
    color: var(--text);
    height: 100vh; /* 改用固定高度配合 flex */
    overflow: hidden;
    touch-action: none;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #2E7D32, #81C784);
    color: white; padding: 12px 20px; text-align: center; position: relative; z-index: 10;
  }
  header h1 { font-size: 1.4rem; font-weight: 900; }
  .home-btn {
    position: absolute; top: 10px; left: 10px;
    background: rgba(255,255,255,.25); border: none; border-radius: 10px;
    color: white; font-size: 13px; font-weight: 700;
    padding: 5px 11px; cursor: pointer; text-decoration: none;
  }

  /* HUD */
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    position: relative; z-index: 10;
  }
  .hud-item { display: flex; flex-direction: column; align-items: center; }
  .hud-val { font-size: 1.5rem; font-weight: 900; color: var(--green); line-height: 1; }
  .hud-lbl { font-size: 10px; color: var(--muted); font-weight: 800; text-transform: uppercase; margin-top: 2px; }
  .lives { color: var(--red); font-size: 1.2rem; }

  /* GAME AREA */
  #gameCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    cursor: crosshair; z-index: 5;
  }

  /* TARGET HINT */
  .target-hint {
    position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); padding: 12px 30px;
    border-radius: 30px; border: 4px solid var(--green);
    text-align: center; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .target-hint.highlight {
    transform: translateX(-50%) scale(1.3);
    border-color: #FF5252;
    background: #FFEB3B;
    animation: shake 0.5s;
  }
  @keyframes shake {
    0%, 100% { margin-left: 0; }
    20%, 60% { margin-left: -10px; }
    40%, 80% { margin-left: 10px; }
  }
  .target-label { font-size: 12px; color: var(--muted); font-weight: 800; }
  .target-zh { font-size: 1.8rem; font-weight: 900; color: var(--dgreen); }

  /* BALLOON (rendered as DOM for simplicity/accessibility) */
  .balloon {
    position: absolute; width: 85px; height: 100px;
    background: var(--green); /* 預設顏色，會被 JS override */
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 900; font-size: 0.95rem;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
    cursor: pointer; transition: transform 0.1s;
    user-select: none;
    z-index: 20;
  }
  .balloon::after {
    content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
    border-left: 2px solid rgba(0,0,0,0.2); height: 15px;
  }
  .balloon.pop { transform: scale(1.5); opacity: 0; pointer-events: none; }

  /* OVERLAYS */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: white; border-radius: 24px;
    padding: 30px 20px; width: 100%; max-width: 360px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .o-icon { font-size: 4rem; margin-bottom: 10px; }
  .o-btn {
    display: block; width: 100%; margin: 10px 0;
    padding: 14px; background: var(--green); color: white;
    border: none; border-radius: 20px; font-size: 1.1rem; font-weight: 900;
    cursor: pointer; text-decoration: none;
  }
  .o-btn.secondary { background: #eee; color: #555; }

  /* FEEDBACK */
  .feedback {
    position: fixed; pointer-events: none; font-size: 1.5rem; font-weight: 900;
    z-index: 100; animation: float-up 0.6s ease-out forwards;
  }
  @keyframes float-up { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
</style>
</head>
<body>

<header>
  <a href="index.html" class="home-btn">🏠</a>
  <h1>🎈 疾速氣球射手</h1>
</header>

<div class="hud">
  <div class="hud-item">
    <div class="hud-val" id="scoreVal">0</div>
    <div class="hud-lbl">得分</div>
  </div>
  <div class="hud-item">
    <div class="hud-val lives" id="livesVal">❤️❤️❤️❤️❤️</div>
    <div class="hud-lbl">生命值</div>
  </div>
  <div class="hud-item">
    <div class="hud-val" id="speedVal">1.0x</div>
    <div class="hud-lbl">速度</div>
  </div>
</div>

<div class="target-hint" id="targetHint">
  <div id="nextWordLabel" style="font-size:12px; color:#FF5252; font-weight:900; display:none;">NEW TARGET!</div>
  <div class="target-label">擊破對應單字：</div>
  <div class="target-zh" id="targetZh">---</div>
</div>

<div id="screenFlash" style="position:fixed; inset:0; background:rgba(255,235,59,0.25); pointer-events:none; z-index:150; display:none;"></div>

<div id="gameScene" style="position:relative; flex:1; overflow:hidden;"></div>

<!-- START OVERLAY -->
<div class="overlay show" id="startOverlay">
  <div class="overlay-box">
    <div class="o-icon">🎯</div>
    <h2>疾速氣球！</h2>
    <p>看上方中文提示，擊破正確的氣球！<br><br>⚠️ <strong>氣球會越來越快！</strong><br>⚠️ <strong>注意拼寫相似的陷阱！</strong></p>
    <button class="o-btn" onclick="startGame()">開始挑戰！</button>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-box">
    <div class="o-icon" id="resIcon"></div>
    <h2 id="resTitle"></h2>
    <p id="resMsg"></p>
    <button class="o-btn" onclick="location.reload()">🔄 再試一次</button>
    <a class="o-btn secondary" href="index.html">🏠 回首頁</a>
  </div>
</div>

<script>
const vocab = [
  {en:'elephant', zh:'大象', distractors:['elegant','element']},
  {en:'monkey', zh:'猴子', distractors:['money','monk']},
  {en:'afternoon', zh:'下午', distractors:['afterward','noon']},
  {en:'shoes', zh:'鞋子', distractors:['shows','shoos']},
  {en:'sunny', zh:'晴天', distractors:['funny','bunny']},
  {en:'cloudy', zh:'多雲', distractors:['cloud','clout']},
  {en:'winter', zh:'冬天', distractors:['winner','windy']},
  {en:'spring', zh:'春天', distractors:['spring','string']},
  {en:'butterfly', zh:'蝴蝶', distractors:['butter','flyer']},
  {en:'breakfast', zh:'早餐', distractors:['break','fasten']},
  {en:'kitchen', zh:'廚房', distractors:['kitten','chicken']}
];

const COLORS = ['#FF5252', '#448AFF', '#4CAF50', '#FFAB40', '#E040FB', '#00BCD4'];

let score = 0;
let lives = 5;
let speedMult = 1.0;
let gameRunning = false;
let currentTarget = null;
let spawnTimer = null;
let lastSpawn = 0;

const scene = document.getElementById('gameScene');

function startGame() {
  document.getElementById('startOverlay').classList.remove('show');
  gameRunning = true;
  nextTarget();
  gameLoop();
}

function nextTarget() {
  currentTarget = vocab[Math.floor(Math.random() * vocab.length)];
  const hint = document.getElementById('targetHint');
  const flash = document.getElementById('screenFlash');
  const nextLbl = document.getElementById('nextWordLabel');
  
  document.getElementById('targetZh').textContent = currentTarget.zh;
  
  // 切換提示動畫
  hint.classList.add('highlight');
  flash.style.display = 'block';
  nextLbl.style.display = 'block';
  
  setTimeout(() => {
    hint.classList.remove('highlight');
    flash.style.display = 'none';
    nextLbl.style.display = 'none';
  }, 600);
}

function spawnBalloon() {
  const isTarget = Math.random() > 0.4;
  let word = '';
  if (isTarget) {
    word = currentTarget.en;
  } else {
    // Pick random distractor or other word
    const randVocab = vocab[Math.floor(Math.random() * vocab.length)];
    if (randVocab.en === currentTarget.en) {
      word = randVocab.distractors[0];
    } else {
      word = randVocab.en;
    }
  }

  const b = document.createElement('div');
  b.className = 'balloon';
  b.textContent = word;
  b.style.left = (Math.random() * (scene.clientWidth - 90)) + 'px';
  b.style.top = scene.clientHeight + 'px';
  b.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
  
  b.onclick = (e) => {
    if (!gameRunning) return;
    popBalloon(b, word === currentTarget.en, e.clientX, e.clientY);
  };

  scene.appendChild(b);
  animateBalloon(b);
}

function animateBalloon(b) {
  let pos = scene.clientHeight;
  const step = () => {
    if (!gameRunning) return;
    pos -= 1.2 * speedMult;
    b.style.top = pos + 'px';
    
    if (pos < -110) {
      if (b.textContent === currentTarget.en) {
        miss();
      }
      b.remove();
    } else {
      requestAnimationFrame(step);
    }
  };
  requestAnimationFrame(step);
}

function popBalloon(b, correct, x, y) {
  b.classList.add('pop');
  setTimeout(() => b.remove(), 100);

  if (correct) {
    playSound('success');
    score += 10;
    speedMult = 1.0 + (score / 400);
    showFeedback('✅ +10', 'green', x, y);
    nextTarget();
    updateHUD();
  } else {
    playSound('error');
    showFeedback('❌ 扣命!', 'red', x, y);
    takeDamage();
  }
}

function miss() {
  playSound('error');
  showFeedback('💨 漏掉了!', 'orange', window.innerWidth/2, 150);
  takeDamage();
}

function takeDamage() {
  lives--;
  updateHUD();
  if (lives <= 0) endGame();
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('livesVal').textContent = '❤️'.repeat(Math.max(0, lives));
  document.getElementById('speedVal').textContent = speedMult.toFixed(1) + 'x';
}

function showFeedback(text, color, x, y) {
  const f = document.createElement('div');
  f.className = 'feedback';
  f.textContent = text;
  f.style.color = color === 'green' ? '#4CAF50' : color === 'red' ? '#f44336' : '#FF8C00';
  f.style.left = x + 'px';
  f.style.top = y + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 600);
}

function gameLoop() {
  if (!gameRunning) return;
  const now = Date.now();
  const spawnRate = Math.max(800, 2000 - (score * 5));
  if (now - lastSpawn > spawnRate) {
    spawnBalloon();
    lastSpawn = now;
  }
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;
  const isWin = score >= 100;
  if (isWin) saveProgress();
  
  document.getElementById('resIcon').textContent = isWin ? '🏆' : '💀';
  document.getElementById('resTitle').textContent = isWin ? '成功過關！' : '挑戰失敗';
  document.getElementById('resMsg').textContent = isWin 
    ? `你得了 ${score} 分！速度極限：${speedMult.toFixed(1)}x` 
    : `分數：${score}。氣球太快了嗎？再試一次！`;
  document.getElementById('resultOverlay').classList.add('show');
}

function saveProgress() {
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  prog['game5'] = 'done';
  localStorage.setItem('progress_g4', JSON.stringify(prog));
}

// Mark in_progress on load
(function() {
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  if (prog['game5'] !== 'done') { prog['game5'] = 'in_progress'; localStorage.setItem('progress_g4', JSON.stringify(prog)); }
})();
</script>
</body>
</html>
