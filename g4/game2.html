<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 2 – 打地鼠</title>
<style>
  :root {
    --green: #4CAF50; --dgreen: #2E7D32; --light: #F1F8E9;
    --orange: #FF8C00; --radius: 16px; --text: #333; --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1B5E20, #4CAF50);
    color: white; padding: 14px 20px; text-align: center; position: relative;
  }
  header h1 { font-size: 1.5rem; font-weight: 900; }
  header p  { font-size: 12px; opacity: .8; margin-top: 3px; }
  .home-btn {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.25); border: none; border-radius: 10px;
    color: white; font-size: 13px; font-weight: 700;
    padding: 5px 11px; cursor: pointer; text-decoration: none; display: inline-block;
  }

  /* HUD */
  .hud {
    display: flex; justify-content: center; gap: 20px;
    padding: 14px 16px; max-width: 500px; margin: 0 auto;
  }
  .hud-box {
    flex: 1; background: white; border-radius: var(--radius);
    padding: 10px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .hud-box .h-val { font-size: 2rem; font-weight: 900; color: var(--green); }
  .hud-box .h-lbl { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  .hud-box.timer-box .h-val { color: var(--orange); }
  .hud-box.timer-box .h-val.urgent { color: #f44336; animation: pulse .5s infinite alternate; }
  @keyframes pulse { from{opacity:1} to{opacity:.4} }

  /* FIELD */
  .field {
    max-width: 500px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; padding: 0 16px 16px;
  }

  /* HOLE */
  .hole {
    position: relative; height: 110px;
    background: #8D6E63; border-radius: 50% 50% 48% 48% / 30% 30% 20% 20%;
    overflow: hidden; cursor: pointer;
    box-shadow: inset 0 4px 12px rgba(0,0,0,.35), 0 4px 0 #5D4037;
  }
  .mole {
    position: absolute; bottom: -100%; left: 50%; transform: translateX(-50%);
    width: 80px; text-align: center;
    transition: bottom .25s cubic-bezier(.175,.885,.32,1.275);
    user-select: none;
  }
  .mole.up { bottom: 0; }
  .mole .m-face { font-size: 2.6rem; line-height: 1; }
  .mole .m-zh {
    background: white; border-radius: 10px;
    font-size: 13px; font-weight: 900; color: #333;
    padding: 2px 6px; margin-top: 2px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
    white-space: nowrap;
  }
  .mole.whacked .m-face { animation: whack .3s ease forwards; }
  @keyframes whack { 0%{transform:scale(1)} 40%{transform:scale(1.4) rotate(-15deg)} 100%{transform:scale(0)} }

  /* CHOICES */
  .choices-wrap {
    max-width: 500px; margin: 0 auto; padding: 0 16px 20px;
  }
  .choices-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 1px; text-align: center; margin-bottom: 8px; }
  .choices {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .ch-btn {
    background: white; border: 3px solid #C8E6C9;
    border-radius: 14px; padding: 12px 8px;
    font-size: 1rem; font-weight: 800; cursor: pointer;
    transition: all .15s; color: var(--text);
  }
  .ch-btn:hover { border-color: var(--green); background: #E8F5E9; }
  .ch-btn.hit  { border-color: var(--green); background: #E8F5E9; color: var(--dgreen); animation: hit-flash .3s; }
  .ch-btn.miss { border-color: #f44336; background: #FFEBEE; color: #c62828; animation: hit-flash .3s; }
  @keyframes hit-flash { 0%{transform:scale(1)} 50%{transform:scale(.93)} 100%{transform:scale(1)} }

  /* FEEDBACK */
  .feedback {
    text-align: center; font-size: 1.2rem; font-weight: 900;
    min-height: 32px; margin-bottom: 8px;
    transition: opacity .2s;
  }
  .feedback.ok  { color: var(--green); }
  .feedback.no  { color: #f44336; }

  /* START / RESULT OVERLAY */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.55); z-index: 200;
    align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: white; border-radius: 24px;
    padding: 32px 24px; width: 92%; max-width: 380px;
    text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.2);
    animation: pop-in .25s ease;
  }
  @keyframes pop-in { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
  .overlay-box .o-icon { font-size: 4rem; margin-bottom: 10px; }
  .overlay-box h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
  .overlay-box p  { font-size: 15px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  .o-btn {
    display: inline-block; margin: 6px;
    background: var(--green); color: white;
    border: none; border-radius: 24px;
    padding: 12px 28px; font-size: 1rem; font-weight: 900;
    cursor: pointer; text-decoration: none;
    box-shadow: 0 4px 12px rgba(76,175,80,.3);
  }
  .o-btn.secondary { background: #607D8B; box-shadow: none; }

  /* SCORE POP */
  .score-pop {
    position: fixed; pointer-events: none; font-size: 1.4rem; font-weight: 900;
    color: var(--green); z-index: 100;
    animation: float-up .8s ease forwards;
  }
  @keyframes float-up { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-60px)} }
</style>
</head>
<body>

<header>
  <a href="index.html" class="home-btn">🏠 首頁</a>
  <h1>🔨 打地鼠</h1>
  <p>Unit 5–8 複習闖關 · 看中文打英文！</p>
</header>

<div class="hud">
  <div class="hud-box">
    <div class="h-val" id="scoreVal">0</div>
    <div class="h-lbl">SCORE</div>
  </div>
  <div class="hud-box timer-box">
    <div class="h-val" id="timerVal">60</div>
    <div class="h-lbl">SECONDS</div>
  </div>
  <div class="hud-box">
    <div class="h-val" id="comboVal">x1</div>
    <div class="h-lbl">COMBO</div>
  </div>
</div>

<div class="field" id="field">
  <div class="hole" id="hole0"><div class="mole" id="mole0"><div class="m-face">🐹</div><div class="m-zh" id="mzh0"></div></div></div>
  <div class="hole" id="hole1"><div class="mole" id="mole1"><div class="m-face">🐹</div><div class="m-zh" id="mzh1"></div></div></div>
  <div class="hole" id="hole2"><div class="mole" id="mole2"><div class="m-face">🐹</div><div class="m-zh" id="mzh2"></div></div></div>
  <div class="hole" id="hole3"><div class="mole" id="mole3"><div class="m-face">🐹</div><div class="m-zh" id="mzh3"></div></div></div>
  <div class="hole" id="hole4"><div class="mole" id="mole4"><div class="m-face">🐹</div><div class="m-zh" id="mzh4"></div></div></div>
  <div class="hole" id="hole5"><div class="mole" id="mole5"><div class="m-face">🐹</div><div class="m-zh" id="mzh5"></div></div></div>
</div>

<div class="choices-wrap">
  <div class="feedback" id="feedback"></div>
  <div class="choices-label">選出正確的英文單字 ↓</div>
  <div class="choices" id="choices"></div>
</div>

<!-- START OVERLAY -->
<div class="overlay show" id="startOverlay">
  <div class="overlay-box">
    <div class="o-icon">🔨</div>
    <h2>打地鼠！</h2>
    <p>地鼠會冒出中文提示<br>在下方選出對應的英文單字<br>答對得分、combo 越高分越高！<br><br>共 <strong>60 秒</strong></p>
    <button class="o-btn" onclick="startGame()">開始遊戲！</button>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-box">
    <div class="o-icon" id="resultIcon"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <button class="o-btn" onclick="restartGame()">🔄 再玩一次</button>
    <a class="o-btn secondary" href="index.html">🏠 回首頁</a>
  </div>
</div>

<script>
const vocab = [
  // Unit 5
  {en:'dog',zh:'狗'},{en:'cat',zh:'貓'},{en:'bird',zh:'鳥'},
  {en:'fish',zh:'魚'},{en:'rabbit',zh:'兔子'},{en:'tiger',zh:'老虎'},
  {en:'elephant',zh:'大象'},{en:'monkey',zh:'猴子'},
  // Unit 6
  {en:'morning',zh:'早上'},{en:'noon',zh:'中午'},{en:'afternoon',zh:'下午'},
  {en:'night',zh:'晚上'},{en:'eat',zh:'吃'},{en:'sleep',zh:'睡覺'},
  {en:'study',zh:'讀書'},{en:'play',zh:'玩'},
  // Unit 7
  {en:'red',zh:'紅色'},{en:'blue',zh:'藍色'},{en:'green',zh:'綠色'},
  {en:'yellow',zh:'黃色'},{en:'shirt',zh:'上衣'},{en:'pants',zh:'褲子'},
  {en:'shoes',zh:'鞋子'},{en:'hat',zh:'帽子'},
  // Unit 8
  {en:'sunny',zh:'晴天'},{en:'cloudy',zh:'多雲'},{en:'rainy',zh:'下雨'},
  {en:'windy',zh:'刮風'},{en:'hot',zh:'熱'},{en:'cold',zh:'冷'},
  {en:'spring',zh:'春天'},{en:'winter',zh:'冬天'},
];

const HOLES = 6;
const CHOICE_COUNT = 4;
let score = 0, combo = 1, timeLeft = 60;
let timerInterval = null, moleTimers = [];
let activeMoles = {}; // holeIdx -> vocab item
let currentChoices = [];
let activeMoleIdx = -1; // which mole is "active" (target)
let gameRunning = false;

function shuffle(a) { return [...a].sort(() => Math.random() - .5); }

function startGame() {
  document.getElementById('startOverlay').classList.remove('show');
  gameRunning = true;
  score = 0; combo = 1; timeLeft = 60;
  updateHUD();
  timerInterval = setInterval(tick, 1000);
  scheduleMole();
}

function tick() {
  timeLeft--;
  const tv = document.getElementById('timerVal');
  tv.textContent = timeLeft;
  tv.className = 'h-val' + (timeLeft <= 10 ? ' urgent' : '');
  if (timeLeft <= 0) endGame();
}

function endGame() {
  gameRunning = false;
  clearInterval(timerInterval);
  moleTimers.forEach(clearTimeout);
  // hide all moles
  for (let i = 0; i < HOLES; i++) hideMole(i);

  // save progress
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  prog['game2'] = 'done';
  localStorage.setItem('progress_g4', JSON.stringify(prog));

  const icon = score >= 30 ? '🏆' : score >= 15 ? '🎉' : '💪';
  const title = score >= 30 ? '超厲害！' : score >= 15 ? '很不錯！' : '繼續加油！';
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = `你得了 ${score} 分！\nUnit 5–8 的單字你都認識了嗎？`;
  document.getElementById('resultOverlay').classList.add('show');
}

function restartGame() {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('choices').innerHTML = '';
  document.getElementById('feedback').textContent = '';
  activeMoles = {};
  activeMoleIdx = -1;
  startGame();
}

// ── MOLE LOGIC ──
function scheduleMole() {
  if (!gameRunning) return;
  const delay = Math.max(600, 1400 - score * 8);
  const t = setTimeout(popMole, delay);
  moleTimers.push(t);
}

function popMole() {
  if (!gameRunning) return;
  // find an empty hole
  const emptyHoles = [];
  for (let i = 0; i < HOLES; i++) { if (!activeMoles[i]) emptyHoles.push(i); }
  if (emptyHoles.length === 0) { scheduleMole(); return; }

  const holeIdx = emptyHoles[Math.floor(Math.random() * emptyHoles.length)];
  const item = vocab[Math.floor(Math.random() * vocab.length)];
  activeMoles[holeIdx] = item;

  document.getElementById(`mzh${holeIdx}`).textContent = item.zh;
  const mole = document.getElementById(`mole${holeIdx}`);
  mole.classList.remove('whacked');
  mole.classList.add('up');

  activeMoleIdx = holeIdx;
  showChoices(item);

  // auto-hide after 4s — give player enough time to read and answer
  const hideTimer = setTimeout(() => {
    if (activeMoles[holeIdx] === item) {
      hideMole(holeIdx);
      if (activeMoleIdx === holeIdx) { activeMoleIdx = -1; clearChoices(); }
      combo = 1; updateHUD();
    }
    scheduleMole();
  }, 4000);
  moleTimers.push(hideTimer);
}

function hideMole(idx) {
  document.getElementById(`mole${idx}`).classList.remove('up');
  delete activeMoles[idx];
}

// ── CHOICES ──
function showChoices(correct) {
  const wrongs = shuffle(vocab.filter(v => v.en !== correct.en)).slice(0, CHOICE_COUNT - 1);
  currentChoices = shuffle([correct, ...wrongs]);

  const cont = document.getElementById('choices');
  cont.innerHTML = '';
  currentChoices.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'ch-btn';
    btn.textContent = v.en;
    btn.onclick = () => handleAnswer(v.en, correct.en, btn);
    cont.appendChild(btn);
  });
}

function clearChoices() {
  document.getElementById('choices').innerHTML = '';
}

function handleAnswer(chosen, correct, btn) {
  if (!gameRunning) return;
  const isCorrect = chosen === correct;
  btn.classList.add(isCorrect ? 'hit' : 'miss');

  if (isCorrect) {
    score += combo;
    combo = Math.min(combo + 1, 8);
    showFeedback('✅ +' + (combo - 1 < 2 ? 1 : combo - 1), true);
    floatScore(btn);
    // whack the correct mole
    for (let i = 0; i < HOLES; i++) {
      if (activeMoles[i] && activeMoles[i].en === correct) {
        const mole = document.getElementById(`mole${i}`);
        mole.querySelector('.m-face').style.animation = '';
        void mole.querySelector('.m-face').offsetWidth;
        mole.querySelector('.m-face').style.animation = 'whack .3s ease forwards';
        setTimeout(() => hideMole(i), 300);
        if (activeMoleIdx === i) activeMoleIdx = -1;
        break;
      }
    }
    setTimeout(clearChoices, 200);
  } else {
    playSound('error');
    combo = 1;
    showFeedback('❌ 是「' + correct + '」', false);
  }
  updateHUD();
  setTimeout(() => { btn.classList.remove('hit','miss'); }, 400);
}

function showFeedback(msg, ok) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + (ok ? 'ok' : 'no');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ''; el.className = 'feedback'; }, 1200);
}

function floatScore(btn) {
  const r = btn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = '+' + (combo <= 1 ? 1 : combo - 1);
  el.style.left = (r.left + r.width / 2 - 20) + 'px';
  el.style.top = (r.top + window.scrollY - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('comboVal').textContent = 'x' + combo;
}

// init progress
(function() {
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  if (prog['game2'] !== 'done') { prog['game2'] = 'in_progress'; localStorage.setItem('progress_g4', JSON.stringify(prog)); }
})();
</script>
</body>
</html>
