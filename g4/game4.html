<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 4 – 限時翻牌配對</title>
<script src="../js-common.js"></script>
<style>
  :root {
    --orange: #FF8C00; --yellow: #FFD700; --light: #FFF8EC;
    --green: #4CAF50;  --red: #f44336; --radius: 16px;
    --text: #333; --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--light); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  header {
    background: linear-gradient(135deg, #FF6F00, #FFD54F);
    color: white; padding: 14px 20px; text-align: center; position: relative;
  }
  header h1 { font-size: 1.5rem; font-weight: 900; }
  header p  { font-size: 12px; opacity: .9; margin-top: 3px; }
  .home-btn {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.25); border: none; border-radius: 10px;
    color: white; font-size: 13px; font-weight: 700;
    padding: 5px 11px; cursor: pointer; text-decoration: none; display: inline-block;
  }

  /* HUD */
  .hud {
    display: flex; justify-content: center; gap: 15px;
    padding: 12px 16px; max-width: 500px; margin: 0 auto;
  }
  .hud-box {
    flex: 1; background: white; border-radius: var(--radius);
    padding: 10px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .hud-box .h-val { font-size: 1.8rem; font-weight: 900; color: var(--orange); }
  .hud-box .h-lbl { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .hud-box.urgent .h-val { color: var(--red); animation: pulse .5s infinite alternate; }
  @keyframes pulse { from{opacity:1} to{opacity:.5} }

  /* GRID */
  .game-container { max-width: 500px; margin: 0 auto; padding: 0 12px 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .card {
    aspect-ratio: 1 / 1.3; perspective: 1000px; cursor: pointer;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg) scale(0.9); opacity: 0.6; pointer-events: none; }
  
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    padding: 5px; text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }
  .card-front {
    background: linear-gradient(135deg, var(--orange), var(--yellow));
    color: white; font-size: 1.5rem; font-weight: 900;
  }
  .card-back {
    background: white; border: 3px solid var(--orange);
    color: var(--text); transform: rotateY(180deg);
    font-size: 0.9rem; font-weight: 800; overflow: hidden;
    word-break: break-all;
  }
  .card-back.zh { color: #E65100; font-size: 1.1rem; }

  /* OVERLAY */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: white; border-radius: 24px;
    padding: 30px 20px; width: 100%; max-width: 360px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: pop-in 0.3s ease-out;
  }
  @keyframes pop-in { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
  .o-icon { font-size: 4rem; margin-bottom: 10px; }
  .o-btn {
    display: block; width: 100%; margin: 10px 0;
    padding: 14px; background: var(--orange); color: white;
    border: none; border-radius: 20px; font-size: 1.1rem; font-weight: 900;
    cursor: pointer; text-decoration: none;
  }
  .o-btn.secondary { background: #eee; color: #555; }
  
  /* PENALTY FLASH */
  .penalty-flash {
    position: fixed; inset: 0; background: rgba(244, 67, 54, 0.2);
    pointer-events: none; z-index: 150; display: none;
    animation: flash 0.3s;
  }
  @keyframes flash { 0%{opacity:0} 50%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>

<header>
  <a href="index.html" class="home-btn">🏠 首頁</a>
  <h1>🧠 限時翻牌配對</h1>
  <p>Unit 1–4 挑戰 · 速度與記憶的對決！</p>
</header>

<div class="hud">
  <div class="hud-box" id="timerBox">
    <div class="h-val" id="timeVal">90</div>
    <div class="h-lbl">剩餘時間</div>
  </div>
  <div class="hud-box">
    <div class="h-val" id="scoreVal">0</div>
    <div class="h-lbl">配對進度</div>
  </div>
</div>

<div class="game-container">
  <div class="grid" id="grid"></div>
</div>

<div class="penalty-flash" id="penaltyFlash"></div>

<!-- START OVERLAY -->
<div class="overlay show" id="startOverlay">
  <div class="overlay-box">
    <div class="o-icon">⏳</div>
    <h2>準備好了嗎？</h2>
    <p>在 <strong>90 秒</strong> 內配對 10 組單字！</p>
    <button class="o-btn" onclick="startGame()">開始挑戰！</button>
  </div>
</div>

<!-- WIN/LOSE OVERLAY -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-box">
    <div class="o-icon" id="resIcon"></div>
    <h2 id="resTitle"></h2>
    <p id="resMsg"></p>
    <button class="o-btn" onclick="location.reload()">🔄 再試一次</button>
    <a class="o-btn secondary" href="index.html">🏠 回首頁</a>
  </div>
</div>

<script>
const vocab = [
  {en:'favorite', zh:'最喜歡的'}, {en:'friend', zh:'朋友'}, 
  {en:'father', zh:'爸爸'}, {en:'mother', zh:'媽媽'},
  {en:'brother', zh:'哥哥/弟弟'}, {en:'sister', zh:'姐姐/妹妹'},
  {en:'pencil', zh:'鉛筆'}, {en:'eraser', zh:'橡皮擦'},
  {en:'bread', zh:'麵包'}, {en:'water', zh:'水'}
];

let cards = [];
let flipped = [];
let matchedCount = 0;
let timeLeft = 90;
let timer = null;
let gameRunning = false;

function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

function initCards() {
  const deck = [];
  vocab.forEach((item, idx) => {
    deck.push({ type: 'en', value: item.en, pairId: idx });
    deck.push({ type: 'zh', value: item.zh, pairId: idx });
  });
  cards = shuffle(deck);
  
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cards.forEach((cardData, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = index;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">?</div>
        <div class="card-back ${cardData.type}">${cardData.value}</div>
      </div>
    `;
    card.onclick = () => onCardClick(card, index);
    grid.appendChild(card);
  });
}

function onCardClick(el, idx) {
  if (!gameRunning || flipped.length >= 2 || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  
  el.classList.add('flipped');
  flipped.push({ el, data: cards[idx] });
  
  if (flipped.length === 2) {
    checkMatch();
  }
}

function checkMatch() {
  const [c1, c2] = flipped;
  if (c1.data.pairId === c2.data.pairId) {
    // Match
    playSound('success');
    setTimeout(() => {
      c1.el.classList.add('matched');
      c2.el.classList.add('matched');
      matchedCount++;
      document.getElementById('scoreVal').textContent = matchedCount;
      flipped = [];
      if (matchedCount === vocab.length) win();
    }, 400);
  } else {
    // No match
    playSound('error');
    setTimeout(() => {
      c1.el.classList.remove('flipped');
      c2.el.classList.remove('flipped');
      flipped = [];
      // Penalty
      applyPenalty();
    }, 800);
  }
}

function applyPenalty() {
  const flash = document.getElementById('penaltyFlash');
  flash.style.display = 'block';
  setTimeout(() => flash.style.display = 'none', 300);
}

function startGame() {
  document.getElementById('startOverlay').classList.remove('show');
  initCards();
  gameRunning = true;
  timer = setInterval(() => {
    timeLeft--;
    updateHUD();
    if (timeLeft <= 0) lose();
  }, 1000);
}

function updateHUD() {
  const val = document.getElementById('timeVal');
  val.textContent = timeLeft;
  const box = document.getElementById('timerBox');
  if (timeLeft <= 10) box.classList.add('urgent');
}

function win() {
  gameRunning = false;
  clearInterval(timer);
  saveProgress();
  showResult('🏆', '挑戰成功！', `太強了！你在時間內完成了所有配對。`);
}

function lose() {
  gameRunning = false;
  clearInterval(timer);
  showResult('⏰', '時間到！', '挑戰失敗，別灰心，再試一次吧！');
}

function showResult(icon, title, msg) {
  document.getElementById('resIcon').textContent = icon;
  document.getElementById('resTitle').textContent = title;
  document.getElementById('resMsg').textContent = msg;
  document.getElementById('resultOverlay').classList.add('show');
}

function saveProgress() {
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  prog['game4'] = 'done';
  localStorage.setItem('progress_g4', JSON.stringify(prog));
}

// Mark in_progress on load
(function() {
  const prog = JSON.parse(localStorage.getItem('progress_g4') || '{}');
  if (prog['game4'] !== 'done') { prog['game4'] = 'in_progress'; localStorage.setItem('progress_g4', JSON.stringify(prog)); }
})();
</script>
</body>
</html>
